name: Supreme Court cause-list fetch (multi-wave)

# The court publishes ADVANCE lists days ahead, MAIN lists a few days ahead, and
# SUPPLEMENTARY lists the evening before (often 8-9 PM, sometimes later). Staff
# enter court+item as soon as briefing counsel call, so the publish->fetch gap
# should stay small through the working day: hourly, 08:00-23:00 IST, Mon-Sat.
# Cheap by design: fetch_causelist.py probes each list with a 1KB ranged GET and
# only downloads a PDF when the court re-published it; a no-change run commits
# nothing. GitHub cron is UTC; IST = UTC + 5:30. (Scheduled runs can drift a few
# minutes under GitHub load.)
on:
  schedule:
    - cron: "30 2-17 * * 1-6"   # hourly at :30 UTC = 08:00-23:00 IST, Mon-Sat
  workflow_dispatch:             # manual "Run workflow" button

# Never let two scheduled runs overlap and race on the commit.
concurrency:
  group: causelist
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PDF reader
        run: pip install pdfplumber
      - name: Fetch upcoming cause lists (advance + main + supplementary)
        run: python fetch_causelist.py
      - name: Commit court-updates.json if changed
        run: |
          git config user.name  "causelist-bot"
          git config user.email "actions@github.com"
          git add court-updates.json
          if git diff --staged --quiet; then
            echo "No change."
          else
            git commit -m "Cause-list refresh $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
