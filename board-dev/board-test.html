<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141a22">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SD Court App">
<title>SD Court App</title>
<link rel="manifest" href="board-manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.5.0/dist/tabler-icons.min.css">
<style>
/* ---- SD Court Display Board — the familiar SC board (all courts + current
   item), light theme, with our chamber's matters colour-coded on it. ---- */
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap');
:root{
  --bg:#e9ecef; --panel:#ffffff; --panel2:#f3f5f7; --ink:#161a1f; --mut:#697682;
  --line:#d5dae0; --navy:#141a22; --accent:#2f5596; --gold:#b09456;
  --now:#d23a34;  --now-bg:#fbe7e5;
  --soon:#c1820f; --soon-bg:#fbf1d8;
  --later:#3c8654; --later-bg:#e7f3eb;
  --idle:#98a2ac; --idle-bg:#eef1f4; --passed:#7a8591;
  --shadow:0 1px 3px rgba(20,26,34,.08),0 4px 16px rgba(20,26,34,.06);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overscroll-behavior:none;
  -webkit-text-size-adjust:100%;touch-action:manipulation;background:var(--panel)}
/* NORMAL-FLOW shell (matches the chamber app, which fills the iOS home-indicator
   area correctly). A position:fixed body does NOT reach the physical bottom in an
   iOS standalone PWA — that was the persistent bottom gap. Here the body is not
   fixed; #app is exactly one viewport tall and only <main> scrolls inside it, and
   the fixed bottom nav anchors to the real screen edge. */
body{color:var(--ink);font-family:Inter,system-ui,sans-serif;
  -webkit-font-smoothing:antialiased}
.mono{font-family:'IBM Plex Mono',monospace}
button{font-family:inherit;cursor:pointer}
.hidden{display:none!important}

/* ---- login ---- */
#login{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(180deg,#f5f7f9,#e4e8ec);padding:20px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;
  padding:30px 26px;width:min(400px,100%);box-shadow:var(--shadow)}
.seal{width:60px;height:60px;border-radius:50%;background:var(--navy);border:2px solid var(--gold);
  display:flex;align-items:center;justify-content:center;margin:0 auto 14px;
  font-family:Fraunces,serif;color:var(--gold);font-weight:600;font-size:24px}
.card h1{font-family:Fraunces,serif;font-weight:600;font-size:22px;margin:0 0 2px;text-align:center;color:var(--ink)}
.card .sub{color:var(--mut);text-align:center;font-size:13px;margin-bottom:20px}
.card label{display:block;font-size:12px;color:var(--mut);margin:12px 0 5px;font-weight:500}
.card input{width:100%;padding:11px 13px;border-radius:10px;border:1px solid var(--line);
  background:var(--panel2);color:var(--ink);font-size:15px}
.card input:focus{outline:none;border-color:var(--accent)}
.btn{width:100%;padding:12px;border:none;border-radius:10px;background:var(--accent);color:#fff;
  font-weight:600;font-size:15px;margin-top:18px}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--mut);margin-top:9px}
.err{color:var(--now);font-size:13px;margin-top:12px;min-height:16px;text-align:center}

/* ---- app shell ---- */
/* Fixed app shell: header + bottom nav never move; only <main> scrolls.
   100dvh tracks the phone's dynamic viewport so nothing is left blank. */
/* #app fills the fixed, full-screen <body> via flex — no vh/dvh (which iOS
   standalone PWAs report short, leaving a blank strip). Header + nav are flex:none,
   only <main> scrolls; the nav therefore sits on the true screen bottom. */
#app{display:flex;flex-direction:column;height:100vh;
  max-width:760px;width:100%;margin-inline:auto;background:var(--bg);overflow:hidden}
@media(min-width:761px){ body{background:#d3d8dd} #app{border-inline:1px solid var(--line)} }

header.top{display:flex;align-items:center;gap:10px;
  padding:calc(env(safe-area-inset-top,0px) + 11px) 15px 11px;
  background:var(--navy);color:#fff;flex:none}
.top .ttl{font-family:Fraunces,serif;font-weight:600;font-size:17px;letter-spacing:.2px;line-height:1.05}
.top .ttl small{display:block;font-family:Inter;color:#9fb0c0;font-size:10px;font-weight:500;letter-spacing:.4px;text-transform:uppercase;margin-top:1px}
.top .spacer{flex:1}
.freshpill{font-size:11px;color:#aeb9c4;display:flex;align-items:center;gap:5px;white-space:nowrap}
.freshdot{width:7px;height:7px;border-radius:50%;background:#4bbd6b;box-shadow:0 0 0 0 rgba(75,189,107,.6);animation:pulse 2s infinite}
.freshdot.stale{background:var(--soon);animation:none}
.freshdot.off{background:#7d8894;animation:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(75,189,107,.5)}70%{box-shadow:0 0 0 7px rgba(75,189,107,0)}100%{box-shadow:0 0 0 0 rgba(75,189,107,0)}}
.iconbtn{background:transparent;border:none;color:#cdd6df;font-size:21px;padding:5px;line-height:1;border-radius:8px}
.iconbtn.on{color:var(--gold)}
@keyframes bellpulse{0%,100%{opacity:1}50%{opacity:.45}}
.iconbtn.on i{animation:bellpulse 2s ease-in-out infinite}
.iconbtn:active{background:rgba(255,255,255,.1)}
.iconbtn.spin i{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* board-tab header strip: nearest directive + senior */
#paneTop{flex:none;padding:9px 12px 0}
/* directive balloon — the senior's "where do I go now" card */
.directive{background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--accent);
  border-radius:14px;padding:11px 13px 12px;box-shadow:var(--shadow);cursor:pointer;transition:transform .1s}
.directive:active{transform:scale(.99)}
.directive.go{border-left-color:var(--now);background:var(--now-bg)}
.directive.soon{border-left-color:var(--soon);background:var(--soon-bg)}
.directive.clear{border-left-color:var(--later);background:var(--later-bg)}
.dir-top{display:flex;align-items:center;gap:11px}
.dir-pill{flex:none;font-size:10px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;
  padding:4px 10px;border-radius:20px;background:var(--accent);color:#fff;white-space:nowrap}
.directive.go .dir-pill{background:var(--now);animation:pulsepill 1.25s ease-in-out infinite}
.directive.soon .dir-pill{background:var(--soon)}
.directive.clear .dir-pill{background:var(--later)}
@keyframes pulsepill{0%,100%{opacity:1}50%{opacity:.5}}
.dir-dest{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.05}
.dir-lead{font-size:10.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.4px;font-weight:700}
.dir-ct{font-family:Fraunces,serif;font-weight:600;font-size:21px;color:var(--ink);margin-top:2px}
.dir-ct b{font-family:'IBM Plex Mono';font-weight:800}
.directive.go .dir-ct b{color:var(--now)}
.dir-eta{flex:none;text-align:center;background:rgba(0,0,0,.055);border-radius:11px;padding:5px 12px;min-width:58px}
.dir-eta b{display:block;font-family:'IBM Plex Mono';font-size:19px;font-weight:800;line-height:1.05;color:var(--ink)}
.dir-eta span{font-size:9px;color:var(--mut);text-transform:uppercase;letter-spacing:.4px}
.directive.go .dir-eta{background:rgba(210,58,52,.14)} .directive.go .dir-eta b{color:var(--now)}
.dir-sub{font-size:12.5px;color:var(--ink);margin-top:8px;line-height:1.3}
.dir-sub b{font-weight:700}
.dir-sen{margin-top:8px;display:inline-flex;align-items:center;gap:6px;
  background:var(--navy);color:#fff;border-radius:20px;padding:4px 11px;font-size:11.5px;font-weight:600}
.dir-sen i{font-size:14px}
.dir-sen.inferred{background:transparent;color:var(--navy);box-shadow:inset 0 0 0 1.5px var(--navy)}
.dir-sen.hidden,.dir-then.hidden,.dir-eta.hidden{display:none}
.dir-then{font-size:12px;margin-top:9px;padding-top:9px;border-top:1px solid var(--line);
  display:flex;align-items:flex-start;gap:7px;color:var(--mut);line-height:1.35}
.dir-then i{font-size:15px;flex:none;margin-top:1px;color:var(--accent)}
.dir-then b{color:var(--ink)}

.seniorbar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-top:9px;
  background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:8px 11px}
.seniorbar .lab{font-size:12px;color:var(--mut)}
.seniorbar .loc{font-weight:700;font-size:14px}
.seniorbar .tag{font-size:9.5px;text-transform:uppercase;letter-spacing:.5px;padding:2px 7px;border-radius:20px;font-weight:700}
.tag.inferred{background:#f3ead0;color:#8a6d1a}
.tag.confirmed{background:#e0f0e6;color:#2c6b41}
.tag.stale{background:#f6ecd6;color:#946a12}
.seniorbar .spacer{flex:1}
.mini{font-size:12px;padding:7px 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
.mini.gold{border-color:var(--gold);color:#7a6320;background:#fbf6ea;font-weight:600}
select.mini{appearance:none}

/* status row (date + freshness) */
.statusrow{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--mut);padding:2px 3px 0}

/* ===== bottom sheet (court / matter details) ===== */
#modalRoot:empty{display:none}
.ovl{position:fixed;inset:0;background:rgba(16,20,26,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--panel);width:100%;max-width:760px;max-height:88%;border-radius:18px 18px 0 0;
  overflow-y:auto;padding:14px 16px calc(18px + env(safe-area-inset-bottom,0px));box-shadow:0 -8px 40px rgba(0,0,0,.25)}
.sheet-grab{width:38px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 12px}
.sheet h2{font-family:Fraunces,serif;font-size:19px;font-weight:600;margin:0 0 2px;display:flex;align-items:center;gap:9px}
.sheet h2 .chip{font-family:'IBM Plex Mono';font-size:13px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:2px 8px}
.sheet .sh-sub{color:var(--mut);font-size:12.5px;margin-bottom:12px}
.sh-sec{font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--mut);font-weight:700;margin:14px 0 6px}
.sh-box{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:12.5px;line-height:1.5}
.sh-row{display:flex;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:13px}
.sh-row:last-child{border-bottom:none}
.sh-row .k{color:var(--mut);min-width:86px;flex:none}
.sh-matter{display:flex;gap:10px;align-items:center;background:var(--panel2);border:1px solid var(--line);
  border-radius:11px;padding:10px 12px;margin-bottom:7px;cursor:pointer}
.sh-matter:active{transform:scale(.98)}
.sh-matter .mi{font-family:'IBM Plex Mono';font-weight:700;font-size:17px;min-width:34px;text-align:center}
.sh-matter .mt{flex:1;min-width:0;font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sh-btn{display:block;width:100%;padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);
  color:var(--ink);font-weight:600;font-size:14px;margin-top:8px}
.sh-btn.navy{background:var(--navy);color:#fff;border-color:var(--navy)}
.sh-btn.warn2{background:var(--soon-bg);border-color:#e6d29a;color:#7a4f0d}
.po-row{display:flex;gap:7px;margin-top:8px}
.po-row select,.po-row input{flex:1;padding:9px 10px;border-radius:9px;border:1px solid var(--line);background:var(--panel);font-size:14px;color:var(--ink)}
.sh-x{position:sticky;float:right;top:0;background:transparent;border:none;font-size:20px;color:var(--mut);padding:2px}
/* senior-here ribbon across the top of a court island (never covers the number) */
.senpin{display:flex;align-items:center;justify-content:center;gap:4px;align-self:stretch;
  background:var(--navy);color:#fff;border-radius:7px;margin-bottom:4px;padding:2.5px 6px;
  font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;line-height:1.15}
.senpin i{font-size:11px}
.senpin.inferred{background:#fff;color:var(--navy);box-shadow:inset 0 0 0 1.5px var(--navy)}
.cell.mini .senpin{font-size:8px;padding:2px 4px;border-radius:5px;gap:2px;margin-bottom:3px}
.cell.mini .senpin .lab{display:none}
.cell.sen{box-shadow:var(--shadow),0 0 0 2px var(--navy)}
.cell.sen.senlive{animation:senglow 1.9s ease-in-out infinite}
@keyframes senglow{0%,100%{box-shadow:var(--shadow),0 0 0 2px var(--navy)}50%{box-shadow:var(--shadow),0 0 0 5px rgba(16,20,24,.30)}}
.cell[data-setcourt]{cursor:pointer}
.cell[data-setcourt]:active{transform:scale(.97)}

main{flex:1;min-height:0;overflow-y:auto;padding:10px 12px calc(64px + env(safe-area-inset-bottom,0px));-webkit-overflow-scrolling:touch;overscroll-behavior:contain}

/* legend */
.legend{display:flex;gap:12px;font-size:10px;color:var(--mut);margin:0 2px 8px;flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none}

/* ===== the display board — adaptive islands, all 17 on one screen =====
   Courts with our matters keep the full tile; the rest shrink to minis. */
.grid{display:flex;flex-wrap:wrap;gap:6px}
.cell{background:var(--panel);border:1px solid var(--line);border-radius:12px;
  padding:7px 5px 8px;text-align:center;position:relative;min-height:76px;
  display:flex;flex-direction:column;box-shadow:var(--shadow);cursor:pointer;
  flex:1 1 calc(33.33% - 4px);max-width:calc(33.33% - 4px)}
.cell:active{transform:scale(.97)}
.cell-ct{font-size:14px;font-weight:800;letter-spacing:.2px;text-transform:uppercase;
  background:var(--navy);color:#fff;border-radius:20px;padding:3px 12px;align-self:center;line-height:1.1}
.cell-ct .ctn{font-family:'IBM Plex Mono';font-size:16px;font-weight:800;margin-left:1px}
.cell-item{font-family:'IBM Plex Mono';font-size:23px;font-weight:700;color:var(--ink);line-height:1.02;margin-top:3px}
.cell-sub{font-size:9px;color:var(--mut);text-transform:uppercase;letter-spacing:.3px;margin-top:3px}
.cell.idle{background:var(--idle-bg)}
.cell.idle .cell-item{color:var(--idle);font-weight:600}
.cell.idle .cell-ct{background:var(--idle)}
/* mini tile — no chamber matter in this court */
.cell.mini{flex:1 1 calc(20% - 6px);max-width:calc(20% - 6px);min-height:0;padding:6px 2px 7px}
.cell.mini .cell-ct{font-size:12px;padding:2px 9px}
.cell.mini .cell-ct .ctn{font-size:13px}
.cell.mini .cell-item{font-size:16px;margin-top:2px}
.cell.mini .cell-sub{display:none}
/* our courts — colour-coded, shifts as our item nears */
.cell.ours{border-width:2px}
.cell.ours.now{border-color:var(--now);background:var(--now-bg);animation:blink 1.25s ease-in-out infinite}
.cell.ours.soon{border-color:var(--soon);background:var(--soon-bg)}
.cell.ours.later{border-color:var(--later);background:var(--later-bg)}
.cell.ours.passed{border-color:var(--passed);background:var(--idle-bg)}
.cell.ours.idle{border-color:var(--idle)}
@keyframes blink{0%,100%{box-shadow:0 0 0 0 rgba(210,58,52,0)}50%{box-shadow:0 0 0 4px rgba(210,58,52,.35)}}
.cell-ours{margin-top:5px;font-size:10px;font-weight:700;border-radius:7px;padding:3px 4px;line-height:1.25;color:#fff}
.cell-ours .oi{font-family:'IBM Plex Mono';font-size:12px}
.cell.ours.now  .cell-ours{background:var(--now)}
.cell.ours.soon .cell-ours{background:var(--soon)}
.cell.ours.later .cell-ours{background:var(--later)}
.cell.ours.passed .cell-ours{background:var(--passed)}
.cell.ours.idle  .cell-ours{background:var(--idle)}

/* our list (causelist) */
.li{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px 13px;
  margin-bottom:9px;display:flex;gap:12px;box-shadow:var(--shadow)}
.li .ci{flex:none;text-align:center;min-width:48px}
.li .ci .c{font-family:'IBM Plex Mono';font-size:11px;color:var(--mut)}
.li .ci .i{font-family:'IBM Plex Mono';font-size:21px;font-weight:700}
.li .badge2{font-size:9.5px;font-weight:700;border-radius:6px;padding:2px 5px;margin-top:3px;color:#fff;display:inline-block}
.li .badge2.now{background:var(--now)} .li .badge2.soon{background:var(--soon)}
.li .badge2.later{background:var(--later)} .li .badge2.passed{background:var(--passed)}
.li .badge2.idle{background:var(--idle)} .li .badge2.unknown{background:var(--idle)}
.li .d{flex:1;min-width:0}
.li .t{font-weight:700;font-size:13.5px;margin-bottom:2px}
.li .m{font-size:11.5px;color:var(--mut);line-height:1.5}
.li .m b{color:var(--ink);font-weight:600}
/* per-matter status dropdown (mark passed over / over) */
.li-stat{margin-top:8px;font:inherit;font-size:12px;color:var(--ink);background:var(--panel2);
  border:1px solid var(--line);border-radius:8px;padding:6px 8px;max-width:220px;width:100%}
/* a matter marked OVER (attended / not) is struck through here and on the island */
.li.struck .i,.li.struck .t{text-decoration:line-through}
.li.struck{opacity:.6}
.cell-ours s{opacity:.7}

/* chat */
#chatWrap{display:flex;flex-direction:column;height:100%}
#chatList{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding-bottom:8px}
.chat-day{align-self:center;font-size:11px;font-weight:600;letter-spacing:.02em;color:var(--mut);background:var(--panel);border:1px solid var(--line);padding:3px 13px;border-radius:20px;margin:2px 0 8px;position:sticky;top:4px;z-index:1;box-shadow:var(--shadow)}
.msg{max-width:82%;padding:7px 12px 6px;border-radius:14px;background:var(--panel);border:1px solid var(--line);align-self:flex-start;box-shadow:var(--shadow);border-bottom-left-radius:5px}
.msg.mine{align-self:flex-end;background:#e7effb;border-color:#c9dcf3;border-radius:14px;border-bottom-right-radius:5px}
/* grouped runs from the same sender: tighter, softer top corner, no repeated name */
.msg.grp{margin-top:-5px;border-top-left-radius:6px}
.msg.mine.grp{border-top-right-radius:6px}
.msg .who{font-size:11px;color:#8a6d1a;font-weight:700;margin-bottom:2px}
.msg.mine .who{color:var(--accent)}
.msg .tx{font-size:14px;line-height:1.35;word-wrap:break-word;overflow-wrap:anywhere;white-space:pre-wrap;color:var(--ink)}
.msg .tm{font-size:10px;color:var(--mut);margin-top:2px;text-align:right}
.chatbar{display:flex;gap:8px;padding-top:8px;border-top:1px solid var(--line);flex:none}
.chatbar input{flex:1;padding:11px 14px;border-radius:22px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-size:15px}
.chatbar input:focus{outline:none;border-color:var(--accent)}
.chatbar button{border:none;background:var(--accent);color:#fff;width:44px;height:44px;border-radius:50%;font-size:19px;flex:none}

.empty{text-align:center;color:var(--mut);padding:40px 20px;font-size:14px}
.notice{background:var(--soon-bg);border:1px solid #e6d29a;color:#8a6410;border-radius:11px;padding:11px 13px;font-size:12.5px;margin-bottom:12px;line-height:1.45}

/* ===== bottom navigation (mobile-standard) ===== */
/* Fixed to the real screen bottom. A flex child of the fixed-inset body stops at
   the iOS home-indicator boundary (leaving a thumb-wide blank strip in standalone
   PWAs); a directly position:fixed;bottom:0 bar reaches the physical edge on both
   iOS and Android (same pattern as the chamber app). No safe-inset reserve, so the
   buttons sit flush; the translucent home-indicator bar floats over them. */
nav.botnav{position:fixed;bottom:0;left:0;right:0;max-width:760px;margin-inline:auto;
  display:flex;z-index:30;
  background:var(--panel);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px)}
nav.botnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;
  background:transparent;border:none;color:var(--mut);font-size:11px;font-weight:600;
  padding:9px 4px 8px;position:relative}
nav.botnav button i{font-size:22px;line-height:1}
nav.botnav button.on{color:var(--accent)}
nav.botnav .badge{position:absolute;top:4px;left:calc(50% + 8px);background:var(--now);color:#fff;
  border-radius:20px;font-size:9px;padding:1px 5px;min-width:15px;line-height:1.4}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login">
  <div class="card">
    <div class="seal">SD</div>
    <h1 id="lgName">Chamber Display Board</h1>
    <div class="sub">Live Supreme Court board · for the chamber</div>
    <label>Email</label>
    <input id="lgEmail" type="email" autocomplete="username" placeholder="you@example.com">
    <label>Password</label>
    <input id="lgPass" type="password" autocomplete="current-password" placeholder="••••••••">

/* ============================================================

function parseBoard(html){
  const strip = s => s.replace(/<[^>]+>/g," ").replace(/&nbsp;/g," ").replace(/&amp;/g,"&")
    .replace(/&#039;|&apos;/g,"'").replace(/&quot;/g,'"').replace(/&gt;/g,">").replace(/&lt;/g,"<")
    .replace(/\s+/g," ").trim();
  const rows = html.split(/<tr class="record">/i).slice(1);
  const courts = [];
  for (let raw of rows){
    raw = raw.split(/<\/tr>/i)[0];
    let court=""; let m=raw.match(/btn-primary[^>]*>\s*([0-9]+)/i); if(m) court=m[1];
    if(!court){ const im=raw.match(/id="cl_(\d+)"/i); if(im) court=im[1]; }
    const cl=raw.match(/id="cl_\d+"[^>]*>(.*?)<\/td>/is); const cltext=cl?strip(cl[1]):"";
    let item="", status=cltext; const im2=cltext.match(/^(\d+(?:\.\d+)?)\s+(.*)$/);
    if(im2){ item=im2[1]; status=im2[2].trim(); }
    const cn=raw.match(/id="cn_\d+"[^>]*>(.*?)<\/td>/is);
    const cz=raw.match(/id="cnbz_\d+"[^>]*>(.*?)<\/td>/is);
    const seqm=raw.match(/title="([^"]*(?:SEQUENCE|SEQ|sequence)[^"]*)"/i);
    if(!court) continue;
    // Per-court detail link — the FULL cause list for this court, whose last
    // (remark) column carries the authoritative OVER / PASS OVER per item. Only
    // some benches populate it. We capture the link token here; the relay fetches
    // + parses that heavy page and hands us a small item→remark map (refreshRemarks
    // / remarksByCourt). The main board's own status rarely carries "pass over".
    const tok=raw.match(/display_court_all_cases\.php\?([A-Za-z0-9.]+)/i);
    const token=tok?tok[1]:"";
    const passover=/pass\s*over/i.test(status);
    courts.push({ court, item, status, token, passover, caseNo:cn?strip(cn[1]):"", title:cz?strip(cz[1]):"",
      sequence:seqm?strip(seqm[1]):"" });
  }
  return { courts };
}
// Expand a declared sequence; also note WHERE passovers are taken up (the
// "PASS OVER IF ANY" / "fresh passover then" marker) as an index in that order.
function seqInfo(text){
  if(!text) return {seq:[],passIdx:null};
  const toks=text.toUpperCase().replace(/[^0-9A-Z. ]/g," ").split(/\s+/).filter(Boolean);
  const out=[], seen=new Set(); let passIdx=null;
  const push=n=>{ if(!seen.has(n)){seen.add(n);out.push(n);} };
  for(let i=0;i<toks.length;i++){
    const t=toks[i];
    if(passIdx==null && (t==="PASSOVER"||t==="PASSOVERS"||t==="PO"||(t==="PASS"&&(toks[i+1]==="OVER"||toks[i+1]==="OVERS")))) passIdx=out.length;
    const num=t.match(/^(\d+)(?:\.\d+)?$/); if(!num) continue;
    const a=parseInt(num[1],10);
    if(toks[i+1]==="TO" && /^\d+$/.test(toks[i+2]||"")){
      const b=parseInt(toks[i+2],10);
      if(b>=a && b-a<600){ for(let k=a;k<=b;k++) push(k); } else push(a); i+=2;
    } else push(a);
  }
  return {seq:out, passIdx};
}
const expandSequence = text => seqInfo(text).seq;
// NOTE: the sequence text never enumerates which items are passed over — a phrase
// like "…ITEM 85 PASS OVER THEN ITEM 12…" only marks WHERE passed-over matters are
// recalled (after item 85). Which items are actually passed over comes from the
// remark column (isPassOver), the live board status, or a manual chamber mark. The
// recall point is captured by seqInfo().passIdx.
function proximity(seq,current,ours){
  current=parseInt(current,10); ours=Math.floor(parseFloat(ours));
  if(!seq.length||isNaN(current)||isNaN(ours)) return null;
  const curPos=seq.indexOf(current), ourPos=seq.indexOf(ours);
  if(curPos<0||ourPos<0) return {gap:null,of:seq.length,ourPos,curPos};
  return {gap:ourPos-curPos,of:seq.length,ourPos,curPos};
}
// Position of `item` in the court's FULL expected call order: the declared sequence
// first (in its given order), then every OTHER item in ascending number ("…then the
// rest of the matters"). So with a sequence "1-17, 21, 30, …", after 17 the court
// takes 21 — items 18/19/20 are NOT over, they wait for "the rest". Returns an index;
// the gap between two items is the difference of their indices. (No sequence → the
// caller falls back to a plain numeric distance.)
function orderPos(seq, item){
  item=Math.floor(parseFloat(item)); if(isNaN(item)) return null;
  const i=seq.indexOf(item); if(i>=0) return i;             // an explicit-sequence item keeps its slot
  const seqSet=new Set(seq); let before=0;
  for(let n=1;n<item;n++){ if(!seqSet.has(n)) before++; }   // non-sequence items numerically below it
  return seq.length + before;                               // the "rest", after the whole sequence
}
/* ---- Passover marks: shared live via config/live.po (any colleague marks;
   auto-cleared when the date turns). Board-declared passovers merge in. ---- */
const poKey=(court,item)=>String(court)+"_"+String(item);
const poMarks=()=>(live?.po && live.po.date===todayISO() && live.po.marks)||{};
const poFor=(court,item)=>poMarks()[poKey(court,item)]||null;
async function setPO(court,item,mode,after){
  const marks={...poMarks()}; marks[poKey(court,item)]={mode,after:after||null,by:me.uid,at:Date.now()};
  await db.set("config/live",{po:{date:todayISO(),marks}},true);
}
async function clearPO(court,item){
  // Tombstone (null), NOT delete: prod Firestore set(...,{merge:true}) DEEP-merges the
  // marks map, so a removed key would persist. Writing null clears it (poFor reads it
  // as falsy) and works in both the demo and Firestore.
  const marks={...poMarks()}; marks[poKey(court,item)]=null;
  await db.set("config/live",{po:{date:todayISO(),marks}},true);
}
/* ---- Matter OVER marks (attended / did-not-attend) — shared live via
   config/live.done, any member sets it. A matter marked over is done for the day
   and shows struck through on the board + list. (Passover is separate — that
   matter isn't over, it's recalled later, so it is NOT struck.) ---- */
const doneMarks=()=>(live?.done && live.done.date===todayISO() && live.done.marks)||{};
const doneOf=(court,item)=>doneMarks()[poKey(court,item)]||null;   // {v:"att"|"abs",by,at} | null
async function setDone(court,item,v){
  const marks={...doneMarks()}; marks[poKey(court,item)]={v,by:me.uid,at:Date.now()};
  await db.set("config/live",{done:{date:todayISO(),marks}},true);
  if(poFor(court,item)) await clearPO(court,item);   // it's over now, not deferred
}
async function clearDone(court,item){
  // Tombstone (null), NOT delete — see clearPO: prod Firestore merge won't drop a
  // removed nested key, so cancelling "over" would silently do nothing (strike-through
  // stays, court untracked). Writing null clears it; doneOf reads null as "not over".
  const marks={...doneMarks()}; marks[poKey(court,item)]=null;
  await db.set("config/live",{done:{date:todayISO(),marks}},true);
}
/* Board-observed passovers. The board flashes "Pass Over" on an item only while
   it's being deferred, then moves on — so we REMEMBER each one we see (per court,
   today only). When the passed-over item is one of OUR matters we also push it to
   the shared marks so a colleague opening the app later still sees it. */
let boardPO={date:todayISO(),marks:{}};
function recordBoardPO(){
  if(boardPO.date!==todayISO()) boardPO={date:todayISO(),marks:{}};
  for(const c of board){
    if(!c.passover || !c.item) continue;
    const k=poKey(c.court,c.item);
    if(boardPO.marks[k]) continue;
    boardPO.marks[k]=true;
    // share only OUR items (rare, high-value) — avoids write storms on other courts
    if(!DEMO && me && !poFor(c.court,c.item) && courtMatters().some(e=>String(e.courtNo)===String(c.court)&&String(e.itemNo)===String(c.item)))
      setPO(c.court,c.item,"slot").catch(()=>{});
  }
}
const boardPOhas=(court,item)=>boardPO.date===todayISO() && !!boardPO.marks[poKey(court,item)];

/* ---- Per-court REMARK column (authoritative OVER / PASS OVER) ----
   The court-wise board shows only the item currently on. Each court's FULL cause
   list (display_court_all_cases.php) carries a remark against every item — OVER
   (matter finished), PASS OVER (deferred), or blank. Only some benches keep it
   current, but where they do it is ground truth. That page is heavy (~0.5 MB), so
   the relay parses it and returns a small { item: remark } map; we cache per court
   and refresh only our own courts, on a slow cadence (remarks change far slower
   than the live item). */
let remarksByCourt={};                                     // court -> { at, items:{ "5":"OVER", "7":"PASS OVER" } }
let _remarkAt={};                                          // court -> last fetch attempt ms (throttle)
const REMARK_TTL=40000;
function detailRemark(court,item){
  const r=remarksByCourt[String(court)]; if(!r||!r.items) return "";
  const s=String(item); if(r.items[s]) return r.items[s];
  const n=String(Math.floor(parseFloat(item)));            // "12.1" -> "12"
  return (n!=="NaN"&&r.items[n])||"";
}
const isOver     = (court,item)=>/^over$/i.test(detailRemark(court,item));
const isPassOver = (court,item)=>/pass\s*over/i.test(detailRemark(court,item));
// Items the court has already finished (OVER) that sit numerically AHEAD of ours,
// i.e. between the item now on and our item — they were disposed out of turn, so
// they aren't really ahead of us. Used only to tighten the "how far" count; the
// list of over items is never shown.
function overAhead(court,curItem,ours){
  const r=remarksByCourt[String(court)]; if(!r||!r.items) return 0;
  const c=parseFloat(curItem), o=parseFloat(ours); if(isNaN(c)||isNaN(o)) return 0;
  let n=0;
  for(const k in r.items){
    if(!/^over$/i.test(r.items[k])) continue;
    const v=parseFloat(k); if(!isNaN(v) && v>c && v<o) n++;
  }
  return n;
}
// Every item this court has PASSED OVER (deferred), with any recall hint. Sources:
// the authoritative remark column, colleagues' shared marks (config/live.po) and
// passovers we saw flash live on the board — deduped by item number.
function passoverItemsFor(court){
  const out={};                                            // itemNo(int) -> {after:int|null}
  const add=(item,after)=>{ const n=Math.floor(parseFloat(item)); if(isNaN(n))return;
    const a=(after!=null&&after!=="")?Math.floor(parseFloat(after)):null;
    if(!(n in out)) out[n]={after:a}; else if(a!=null&&out[n].after==null) out[n].after=a; };
  const r=remarksByCourt[String(court)];
  if(r&&r.items) for(const k in r.items){ if(/pass\s*over/i.test(r.items[k])) add(k,null); }
  const pm=poMarks(); for(const key in pm){ const i=key.indexOf("_");
    if(i>0 && key.slice(0,i)===String(court)) add(key.slice(i+1), pm[key]&&pm[key].after); }
  if(boardPO.date===todayISO()) for(const key in boardPO.marks){ const i=key.indexOf("_");
    if(i>0 && key.slice(0,i)===String(court)) add(key.slice(i+1),null); }
  return out;
}
// Net change to the count of items AHEAD of ours, caused by passovers:
//   − an item currently ahead of us but recalled AFTER us is no longer ahead
//   + a passed-over item recalled BEFORE us lands ahead of us and adds to the wait
// Sequence space when the bench declares a sequence, else item-number space. A
// passover's recall point = its own "after N" hint, else the sequence's declared
// passover slot (passIdx), else the end of the board (recalled after everyone).
function poAdjust(court, curItem, ours, seq, passIdx){
  const po=passoverItemsFor(court); const keys=Object.keys(po); if(!keys.length) return 0;
  const useSeq=!!(seq&&seq.length);
  const pos=n=>{ n=Math.floor(parseFloat(n)); if(isNaN(n))return null; return useSeq?seq.indexOf(n):n; };
  const curP=pos(curItem), ourP=pos(ours);
  if(curP==null||ourP==null) return 0;
  if(useSeq&&(curP<0||ourP<0)) return 0;
  if(ourP<=curP) return 0;                                 // our item already reached — nothing ahead to adjust
  const endP=useSeq?seq.length:Infinity;                   // "after everyone"
  const ourN=Math.floor(parseFloat(ours));
  let delta=0;
  for(const k of keys){
    if(parseInt(k,10)===ourN) continue;                    // our own item is handled in the passover branch
    const xp=pos(k); if(xp==null||(useSeq&&xp<0)) continue;
    let rp;
    if(po[k].after!=null){ const ap=pos(po[k].after); rp=(ap!=null&&!(useSeq&&ap<0))?ap+1:endP; }
    else rp=(useSeq&&passIdx!=null&&passIdx>curP)?passIdx:endP;
    const aheadOrig=xp>curP&&xp<ourP;                      // was it counted as ahead in the base gap?
    const recallAhead=rp>curP&&rp<ourP;                    // does its recalled slot sit ahead of us?
    if(aheadOrig&&!recallAhead) delta--;                   // deferred to behind us → drop from the count
    else if(!aheadOrig&&recallAhead) delta++;              // recalled ahead of us → add to the wait
  }
  return delta;
}
async function fetchRemarksFor(court,token,force){
  if(!token || BOARD_SAMPLE || !BOARD_PROXY) return;       // demo seeds remarksByCourt directly
  const now=Date.now();
  if(!force && _remarkAt[court] && now-_remarkAt[court]<REMARK_TTL) return;
  _remarkAt[court]=now;
  try{
    const r=await fetch(BOARD_PROXY+"?remarks="+encodeURIComponent(token),{cache:"no-store"});
    if(!r.ok) return;
    const j=await r.json();
    if(j&&j.items) remarksByCourt[String(court)]={at:now, items:j.items};
  }catch(e){}
}
// Pull remarks for the courts we actually have matters in (keeps it light).
function refreshRemarks(){
  const want=new Set(courtMatters().map(e=>String(e.courtNo)));
  for(const c of board){ if(want.has(String(c.court)) && c.token) fetchRemarksFor(c.court,c.token); }
}

/* ---- Regular list sits BEHIND the Miscellaneous list ----
   A court finishes its whole Miscellaneous list (main + supplementary) before it
   takes up the Regular list. So a Regular matter's real distance = the Misc
   matters still pending + its own place in the Regular order. Misc total comes
   from the chamber's fetched causelist; we detect when the court has actually
   reached its Regular list (note: Regular can be LONGER than Misc, so item-number
   size alone can't tell the lists apart — we use "past the whole Misc list" or a
   downward item reset instead). */
// Regular-list matters are numbered in the 101+ series, so an item's PLACE in the
// Regular list is itemNo − 100 (item 101 = the 1st Regular matter). But the
// Miscellaneous list runs 1 … 200+ and can itself reach into the 101 range, so a
// bare item number can't tell the two lists apart — we use the Misc TOTAL plus
// the tell-tale reset (the item drops from the end of Misc back to 101).
const REG_BASE=101;
function miscTotalFor(court){
  const rec=courtUpdates?.by_date?.[todayISO()]?.lists?.["Miscellaneous"]?.[String(court)];
  if(!rec) return null;
  const t=parseInt(rec.total,10); if(!isNaN(t)&&t>0) return t;
  const m=parseInt(rec.main,10), s=parseInt(rec.supp,10);
  return isNaN(m)?null:(m+(isNaN(s)?0:s));
}
let itemHi={date:todayISO(),max:{}};   // highest raw item seen per court today (Misc→Regular reset detector)
function noteItemHi(){
  if(itemHi.date!==todayISO()) itemHi={date:todayISO(),max:{}};
  for(const c of board){ const n=parseInt(c.item,10); if(!isNaN(n)) itemHi.max[c.court]=Math.max(itemHi.max[c.court]||0,n); }
}
// Has the court moved off its Miscellaneous list onto its Regular list?
function onRegularList(court, miscTotal){
  const bc=boardByCourt()[court]; const cur=bc?parseInt(bc.item,10):NaN;
  if(isNaN(cur)) return false;
  if(miscTotal==null) return false;                      // no Misc size → can't tell; treat as behind-Misc
  if(cur>miscTotal+2) return true;                       // item beyond the whole Misc list → Regular (Misc < 101)
  // Misc itself reaches into the 101+ range: Regular shows as the item RESETTING
  // from near the end of Misc (≈ miscTotal) back down to the 101 series.
  const hi=itemHi.max[court]||0;
  if(hi>=miscTotal-3 && cur>=REG_BASE && cur<hi-5) return true;
  return false;
}

// classify our matter against its board court -> {tier,label,short,gap,approx,ment,po}
function classify(e, bc){
  const ours=e.itemNo;
  // Manually marked OVER for the whole chamber (attended / did-not-attend) — done
  // for the day, struck through. Wins over everything else.
  const dn=doneOf(e.courtNo,ours);
  if(dn) return {tier:"passed", label:dn.v==="att"?"over — attended":"over — not attended",
                 short:dn.v==="att"?"over ✓":"over ✗", over:true, done:true};
  if(!bc) return {tier:"unknown",label:"court not on the board",short:"—"};
  if(/not in session/i.test(bc.status||"")) return {tier:"idle",label:"court not sitting",short:"not sitting"};
  if(isMentioning(ours)){
    if(nowMinsIST()>MENT_END) return {tier:"passed",label:"mentioning — over",short:"over",ment:true};
    return {tier:"soon",label:"mentioning — watch",short:"watch",gap:0,ment:true};
  }
  // The board's reserved item series tell us the court's PHASE, not a queue
  // position: the 800s are mentioning matters, the 1500s are judgement
  // pronouncements. While the court is in one of these there's no "N away" — our
  // matter simply waits for the phase to finish.
  const curBoardNum=parseInt(bc.item,10);
  if(curBoardNum>=800 && curBoardNum<900) return {tier:"soon",label:"mentioning is on",short:"mentioning",ment:true};
  if(curBoardNum>=1500 && curBoardNum<1600) return {tier:"soon",label:"pronouncement is on",short:"pronouncement"};
  const oursNum=parseFloat(ours);
  // Authoritative remark from the court's full cause list, where the bench keeps
  // it current: OVER = our matter is finished (short-circuits everything else).
  if(isOver(e.courtNo,ours)) return {tier:"passed",label:"matter is over",short:"over",over:true};
  const {seq,passIdx}=seqInfo(bc.sequence);
  const curPos = seq.length ? seq.indexOf(parseInt(bc.item,10)) : -1;
  // Passed over? — the court's remark column (authoritative), a colleague's mark,
  // or observed live on the board. NOT inferred from the sequence text: "…ITEM 85
  // PASS OVER THEN ITEM 12…" means passovers are recalled AFTER item 85, it does
  // NOT make 85 (or 12) a passed-over item — that only comes from the remark column.
  const mark = poFor(e.courtNo,ours)
    || (isPassOver(e.courtNo,ours) ? {mode:"detail"} : null)
    || (boardPOhas(e.courtNo,ours) ? {mode:"slot"} : null);
  if(mark){
    let gap=null;
    if(mark.mode==="after" && mark.after && seq.length){
      const tp=seq.indexOf(parseInt(mark.after,10));
      if(tp>=0 && curPos>=0) gap=Math.max(0,tp-curPos+1);
    } else if(seq.length && curPos>=0){
      // recalled where the sequence says passovers are taken, else end of board
      const tp=(passIdx!=null && passIdx>curPos) ? passIdx : seq.length-1;
      gap=Math.max(0,tp-curPos);
    }
    if(gap==null) return {tier:"later",label:"passed over — recall time unclear",short:"PO",po:true};
    if(gap<=1) return {tier:"now",label:"PASSED OVER — recall imminent",short:"PO now",gap,po:true};
    if(gap<=4) return {tier:"soon",label:"passed over — recall ~"+gap+" items",short:"PO "+gap,gap,po:true};
    return {tier:"later",label:"passed over — recall in ~"+gap+" items",short:"PO "+gap,gap,po:true};
  }
  // Regular-list matter: reached only after the whole Miscellaneous list is done.
  if(/^reg/i.test((e.listType||"").trim())){
    const miscTotal=miscTotalFor(e.courtNo);
    if(!onRegularList(e.courtNo, miscTotal)){
      // our PLACE in the Regular list: item 101 -> 1st, 112 -> 12th (Regular is 101+)
      const regRank=(Math.floor(oursNum)>=REG_BASE)?(Math.floor(oursNum)-(REG_BASE-1)):Math.max(1,Math.floor(oursNum)||1);
      if(miscTotal==null && !seq.length)
        return {tier:"later",label:"Regular list — after the Miscellaneous list",short:"after Misc",reg:true};
      // Misc matters still to be called: from the live sequence position, else the
      // raw current item; total from the causelist (main + supplementary), else seq.
      const cur=parseInt(bc.item,10);
      const miscDone=(seq.length&&curPos>=0)?curPos+1:(isNaN(cur)?0:cur);
      const miscLeft=Math.max(0,(miscTotal!=null?miscTotal:seq.length)-miscDone);
      const gap=miscLeft+(regRank-1);                          // misc still to go, then regular matters before ours
      const detail=miscLeft>0?"Misc: "+miscLeft+" to go":"Misc done";
      if(gap<=1) return {tier:"now", label:"Regular — get in now", short:"NOW", gap, reg:true};
      if(gap<=4) return {tier:"soon",label:"Regular — ~"+gap+" away · "+detail, short:gap+" away", gap, reg:true};
      return {tier:"later",label:"Regular — ~"+gap+" away · "+detail, short:gap+" away", gap, reg:true};
    }
    // else: the Regular list is running — fall through to normal proximity within it.
  }
  let gap=null, approx=false;
  // Distance in the court's true call order (sequence, then the rest) — NOT raw item
  // numbers, so a sequence like "1-17, 21, 30…" doesn't wrongly show 18/19/20 as over.
  if(seq.length){ const op=orderPos(seq,ours), cp=orderPos(seq,bc.item);
    if(op!=null && cp!=null) gap=op-cp; }
  if(gap==null){ const c=parseFloat(bc.item); if(!isNaN(c)){ gap=Math.floor(oursNum)-Math.floor(c); approx=true; } }
  // Discount matters already finished out of turn (the court's list marks them
  // OVER): they sit between the item now on and ours but won't be called again, so
  // our real distance is that much shorter.
  if(gap!=null && gap>0){ const done=overAhead(e.courtNo,bc.item,ours); if(done>0) gap=Math.max(0,gap-done); }
  // Account for passovers in the running order: an item passed over ahead of us is
  // deferred (no longer really ahead); a passed-over matter recalled before us is
  // pulled in ahead and adds to the wait.
  let poNote="";
  if(gap!=null){ const pa=poAdjust(e.courtNo,bc.item,ours,seq,passIdx);
    if(pa){ gap=Math.max(0,gap+pa); poNote = pa<0 ? " · "+(-pa)+" passed over ahead" : " · "+pa+" recalled first"; } }
  if(gap==null) return {tier:"unknown",label:"position unclear",short:"—"};
  if(gap<0) return {tier:"passed",label:"matter is over",short:"over",gap,approx};
  if(gap<=1) return {tier:"now",label:gap===0?"ITEM ON NOW":"NEXT — get in",short:gap===0?"NOW":"NEXT",gap,approx,poNote};
  if(gap<=4) return {tier:"soon",label:"~"+gap+" items away"+poNote,short:gap+" away",gap,approx,poNote};
  return {tier:"later",label:gap+" items away"+poNote,short:gap+" away",gap,approx,poNote};
}
const TIER_RANK={now:0,soon:1,later:2,unknown:3,passed:4,idle:5};

/* ---- Supreme Court physical layout (from the chamber's hand-drawn map) ----
   All 17 courts ring an oval central hall. Coordinates trace that oval; you walk
   AROUND the corridor, never across the middle — so distance = the shorter arc
   along the ring, not straight-line. Tunable: MIN_PER_PX (walk pace) and
   MIN_PER_ITEM (how fast an item list moves). */
const COURT_XY={1:[990,1015],2:[815,1015],3:[1160,1015],4:[1330,1015],5:[615,1015],
  6:[305,730],7:[390,725],8:[1545,700],9:[1635,700],10:[990,445],11:[895,445],
  12:[785,435],13:[690,465],14:[590,560],15:[510,585],16:[1340,630],17:[1245,555]};
// clockwise around the oval (front-centre 1, up the right, across the top, down the left)
const RING=[1,3,4,9,8,16,17,10,11,12,13,14,15,7,6,5,2];
const MIN_PER_PX=0.00168;     // calibrated so Court 1↔10 ≈ 2.5 min in a clear corridor
const MIN_PER_ITEM=1.1;       // rough: one item ≈ ~1 min of board time
// Corridors are packed 10:30–12:00, so walking is slower then (owner: Court 1↔10
// is ~3–4 min in that crowd, vs ~2.5 min clear). Eases off after noon.
function crowdFactor(){ const nm=nowMinsIST();
  if(nm>=630 && nm<720) return 1.4;   // 10:30–12:00 peak  → Court 1↔10 ≈ 3.5 min
  if(nm>=720 && nm<780) return 1.2;   // 12:00–13:00 easing
  return 1.0; }
const _seg=(a,b)=>{const p=COURT_XY[a],q=COURT_XY[b]; return (p&&q)?Math.hypot(p[0]-q[0],p[1]-q[1]):0;};
function walkMin(a,b){
  a=parseInt(a); b=parseInt(b);
  const ia=RING.indexOf(a), ib=RING.indexOf(b);
  let px;
  if(ia<0||ib<0) px=(COURT_XY[a]&&COURT_XY[b]) ? _seg(a,b) : 1500;
  else if(ia===ib) return 0;
  else {
    let cw=0;  for(let i=ia;i!==ib;i=(i+1)%RING.length) cw+=_seg(RING[i],RING[(i+1)%RING.length]);
    let ccw=0; for(let i=ia;i!==ib;i=(i-1+RING.length)%RING.length) ccw+=_seg(RING[i],RING[(i-1+RING.length)%RING.length]);
    px=Math.min(cw,ccw);
  }
  return px*MIN_PER_PX*crowdFactor();
}
const NEAR_MIN=1.2;           // ≤ this walk from the primary court = "catch both"

/* ---- Live per-court pace ----
   Each court works through its DECLARED SEQUENCE, not 1,2,3. We track each
   court's position in that sequence over time and measure how fast it advances
   (positions per minute), then project our item from that court's real pace —
   so a stalled bench reads slow and a fast one reads fast. Falls back to the
   flat default until a court has ~2 min of history. */
function posOf(bc){
  if(!bc) return null;
  const item=bc.item; if(!item || !/^\d/.test(String(item))) return null;
  const seq=expandSequence(bc.sequence);
  if(seq.length){ const p=seq.indexOf(parseInt(item)); if(p>=0) return p; }
  return parseFloat(item);                       // no sequence → raw item number
}
function recordPace(){
  if(!boardAt) return;
  for(const c of board){
    if(/not in session/i.test(c.status||"")) continue;
    const p=posOf(c); if(p==null) continue;
    const h=paceHist[c.court]||(paceHist[c.court]=[]);
    const last=h[h.length-1];
    if(!last || last.pos!==p) h.push({pos:p,t:boardAt});   // record only on movement
    const cut=boardAt-20*60000; while(h.length>2 && h[0].t<cut) h.shift();
  }
}
function paceVel(court){                          // sequence-positions per minute, or null
  const h=paceHist[court]; if(!h||!h.length||!boardAt) return null;
  const cur=posOf(boardByCourt()[court]); if(cur==null) return null;
  let base=null; for(const e of h){ if(boardAt-e.t<=15*60000){ base=e; break; } }
  if(!base) base=h[h.length-1];
  const dMin=(boardAt-base.t)/60000; if(dMin<2) return null;   // need ≥2 min observed
  return (cur-base.pos)/dMin;                     // 0 = stalled (correctly reads slow)
}
function reachMinsFor(court,k){
  if(!k||k.gap==null) return null;
  const g=Math.max(0,k.gap); if(g===0) return 0;
  const v=paceVel(court);
  if(v==null) return g*MIN_PER_ITEM;              // still calibrating → default pace
  return g/Math.max(v,0.2);                       // measured; cap slowest at 5 min/item
}
const paceMeasured = court => paceVel(court)!=null;

/* ---- ALERTS -----------------------------------------------------------------
   Ping the phone when a chamber matter is reaching, so nobody has to stare at the
   board. Fires a system notification (+ vibration) as a matter crosses into "get
   ready" and then "head now"; a keep-awake lock holds the screen on so the app
   keeps polling. Each level fires once per court+item (re-arms if it recedes).
   Reliable while the app is OPEN/awake; true closed-phone push needs a server. */
let notifyOn=false, _alerted={date:"",lv:{}}, _wakeLock=null;
function alertLevel(k){ if(!k||k.ment) return 0; if(k.tier==="now") return 2; if(k.tier==="soon") return 1; return 0; }
function runAlerts(){
  if(!notifyOn || !("Notification" in window) || Notification.permission!=="granted") return;
  if(_alerted.date!==todayISO()) _alerted={date:todayISO(),lv:{}};
  const bc=boardByCourt();
  for(const e of courtMatters()){
    const k=classify(e,bc[e.courtNo]); const lvl=alertLevel(k);
    const key=e.courtNo+"|"+e.itemNo; const prev=_alerted.lv[key]||0;
    if(lvl>prev){ _alerted.lv[key]=lvl; fireCourtAlert(e,k,lvl); }
    else if(lvl===0 && prev>0){ _alerted.lv[key]=0; }   // re-arm once it recedes
  }
}
function fireCourtAlert(e,k,lvl){
  const head=lvl>=2, mins=reachMinsFor(e.courtNo,k), cur=boardByCourt()[e.courtNo]?.item;
  const title=head?`⚖️ Head to Court ${e.courtNo}`:`Get ready — Court ${e.courtNo}`;
  const body=head
    ? `Your item ${e.itemNo} is ${(k.short==="NOW"||k.gap===0)?"ON now":"next"}.`+(cur?` (item ${cur} on)`:"")
    : `Item ${e.itemNo} approaching`+(mins!=null&&mins>=1?` · ~${Math.round(mins)} min`:(k.gap!=null?` · ${k.gap} away`:""))+`.`;
  pushNotify(title,body,"court-"+e.courtNo,head);
}
async function pushNotify(title,body,tag,urgent){
  const opts={body,tag,renotify:true,icon:"icon-192.png",badge:"icon-192.png",
    vibrate:urgent?[250,120,250,120,250]:[160,90,160],requireInteraction:!!urgent};
  try{ const reg=await navigator.serviceWorker?.ready; if(reg&&reg.showNotification){ await reg.showNotification(title,opts); return; } }catch(e){}
  try{ new Notification(title,opts); }catch(e){}
}
function updateNotifyBtn(){
  const b=$("btnNotify"); if(!b) return;
  const ok="Notification" in window && Notification.permission==="granted" && notifyOn;
  b.classList.toggle("on",ok);
  b.querySelector("i").className = ok?"ti ti-bell-ringing":"ti ti-bell";
  b.title = !("Notification" in window) ? "Alerts not supported here"
    : Notification.permission==="denied" ? "Alerts blocked — enable in phone/browser settings"
    : ok ? "Alerts ON — tap to turn off" : "Alerts off — tap to get pinged when a matter is reaching";
}
async function acquireWake(){ try{ if("wakeLock" in navigator && !_wakeLock){ _wakeLock=await navigator.wakeLock.request("screen"); _wakeLock.addEventListener("release",()=>{_wakeLock=null;}); } }catch(e){} }
function releaseWake(){ try{ if(_wakeLock) _wakeLock.release(); }catch(e){} _wakeLock=null; }
async function toggleNotify(){
  if(!("Notification" in window)){ alert("This browser doesn't support alerts."); return; }
  if(Notification.permission==="default"){ try{ await Notification.requestPermission(); }catch(e){} }
  if(Notification.permission!=="granted"){ alert("Turn on notifications for this site in your phone/browser settings, then tap the bell again."); updateNotifyBtn(); return; }
  notifyOn=!notifyOn; try{ localStorage.setItem("boardNotify",notifyOn?"1":"0"); }catch(e){}
  updateNotifyBtn();
  if(notifyOn){ acquireWake(); pushNotify("Alerts on ⚖️","We'll ping you the moment a chamber matter is reaching — keep this open.","alerts-test",false); runAlerts(); }
  else releaseWake();
}

let me=null, users={}, daysheet=null, live={}, messages={};
let board=[], boardAt=0, boardErr=null, paceHist={}, _primaryCourt=null, courtUpdates=null;
let curTab="board", lastSeenChat=0, userDocUnsub=null, unsub=[], pollId=null, tickId=null, pollOn=false;

const boardByCourt = () => { const m={}; board.forEach(c=>{ if(c.court && !m[c.court]) m[c.court]=c; }); return m; };
const myMatters = () => (daysheet?.entries||[]).filter(e=>e.courtNo);
// The SC has 17 courtrooms; anything above is the Registrar / administrative list.
// The display board tracks the courtrooms only (owner: no registrar under the
// court headings) — registrar matters still appear in "Our list".
const isCourtroom = n => { const x=parseInt(n,10); return x>=1 && x<=17; };
const courtMatters = () => myMatters().filter(e=>isCourtroom(e.courtNo));
const shortTitle = e => e.caseTitle || ("Court "+e.courtNo+" item "+e.itemNo);
const isSenior = () => me?.role==="senior";           // the Senior doesn't set/see his own location

/* ============================================================
   BOARD FETCH
   ============================================================ */
async function fetchBoard(){
  try{
    let html="";
    if(BOARD_SAMPLE){ html=await (await fetch(BOARD_SAMPLE,{cache:"no-store"})).text(); }
    else if(BOARD_PROXY){ html=await (await fetch(BOARD_PROXY+"?ctype=c",{cache:"no-store"})).text(); }
    else { boardErr="relay-unset"; renderBoard(); return; }
    const parsed=parseBoard(html);
    if(parsed.courts.length){ board=parsed.courts; boardAt=Date.now(); boardErr=null; recordPace(); recordBoardPO(); noteItemHi(); refreshRemarks(); }
    else boardErr="empty";
  }catch(e){ boardErr=String(e&&e.message||e); }
  runAlerts();
  renderBoard();
}
// Adaptive polling — we track the SC board as tightly as it moves. When one of
// our matters is at/near its turn we poll every 6s; otherwise every 12s to stay
// light. A self-scheduling timeout (not setInterval) lets the cadence change each
// cycle and never lets two fetches overlap.
function pollDelay(){
  const bc=boardByCourt();
  const hot=courtMatters().some(e=>{ const t=classify(e,bc[e.courtNo]).tier; return t==="now"||t==="soon"; });
  return hot?6000:12000;
}
async function pollLoop(){ if(!pollOn) return; await fetchBoard(); if(!pollOn) return; pollId=setTimeout(pollLoop, pollDelay()); }
function startPolling(){ stopPolling(); pollOn=true; tickId=setInterval(paintFresh,1000); pollLoop(); }  // 1s tick only ages the freshness label
function stopPolling(){ pollOn=false; if(pollId)clearTimeout(pollId); if(tickId)clearInterval(tickId); pollId=tickId=null; }

// Refresh: freshest app version AND freshest board. Clears caches + cache-bust
// reload (so an installed PWA can't sit on a stale shell); reload re-pulls board.
async function hardRefresh(){
  const b=$("btnRefresh"); if(b) b.classList.add("spin");
  try{ if("caches" in window){ const ks=await caches.keys(); await Promise.all(ks.map(k=>caches.delete(k))); } }catch(e){}
  try{ if(navigator.serviceWorker){ const rs=await navigator.serviceWorker.getRegistrations(); rs.forEach(r=>r.update&&r.update()); } }catch(e){}
  const u=new URL(location.href); u.searchParams.set("v", String(Date.now()));
  location.replace(u.toString());
}

function paintFresh(){
  const dot=$("freshDot"), txt=$("statusTxt");
  if(!dot||!txt) return;
  const day=new Date().toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long'});
  if(boardErr==="relay-unset"){ dot.className="freshdot off"; txt.textContent=day+" · relay not set"; return; }
  if(boardErr){ dot.className="freshdot stale"; txt.textContent=day+" · board offline"; return; }
  if(!boardAt){ dot.className="freshdot off"; txt.textContent=day+" · connecting…"; return; }
  dot.className="freshdot"+((Date.now()-boardAt)>45000?" stale":"");
  txt.textContent=day+" · updated "+agoTxt(boardAt);
}

// senior location: confirmed (config/live.court, fresh <25m) else inferred
function seniorState(){
  const c=live?.court; const at=c?tsMs(c.at):0;
  const fresh=at && (Date.now()-at)<25*60*1000;
  if(c && c.court && fresh) return {court:c.court, mode:"confirmed", at, by:c.by};
  const bc=boardByCourt(); let best=null;
  for(const e of courtMatters()){
    const k=classify(e,bc[e.courtNo]);
    if(k.tier==="now"||k.tier==="soon"){ if(!best || (k.gap??99)<(best.gap??99)) best={court:e.courtNo,gap:k.gap}; }
  }
  if(best) return {court:best.court, mode:"inferred"};
  if(c && c.court) return {court:c.court, mode:"stale", at};
  return {court:null, mode:"none"};
}

// Directive balloon: where to head NOW, when our item there is likely to reach,
// where the Senior currently is, and what to do next — enough for him to decide.
function renderRoute(){
  const dir=$("directive"), pill=$("dirPill"), lead=$("dirLead"), ct=$("dirCt"),
        eta=$("dirEta"), etaN=$("dirEtaN"), etaU=$("dirEtaU"),
        sub=$("dirSub"), senEl=$("dirSen"), then=$("dirThen");
  if(!dir) return;
  const rest=()=>{ eta.classList.add("hidden"); senEl.classList.add("hidden"); then.classList.add("hidden"); };
  if(!board.length){
    dir.className="directive"; pill.textContent="…"; lead.textContent="";
    ct.textContent = boardErr && boardErr!=="relay-unset" ? "Board offline" : "Reading the board…";
    sub.textContent=""; rest(); return;
  }
  const bc=boardByCourt();
  // our actionable matters, soonest first (by estimated minutes to our item)
  const cands=courtMatters().map(e=>({e,k:classify(e,bc[e.courtNo])}))
    .filter(x=>["now","soon","later"].includes(x.k.tier))
    .map(x=>({court:x.e.courtNo, e:x.e, k:x.k, mins:reachMinsFor(x.e.courtNo,x.k), meas:paceMeasured(x.e.courtNo)}))
    .sort((a,b)=>((a.mins==null?999:a.mins)-(b.mins==null?999:b.mins)));
  if(!cands.length){
    dir.className="directive clear"; pill.textContent="Clear"; lead.textContent="Nothing imminent";
    ct.innerHTML="All quiet"; sub.textContent="No chamber matter is close right now."; rest(); return;
  }
  const primary=cands[0]; _primaryCourt=primary.court;
  const isNow = primary.k.tier==="now" && !primary.k.ment;
  const tier = isNow ? "go" : (primary.k.tier==="soon" ? "soon" : "");
  dir.className="directive"+(tier?" "+tier:"");
  pill.textContent = isNow ? "Go now" : (primary.k.tier==="soon" ? "Soon" : "Ahead");
  lead.textContent = isNow ? "Head to" : "Get ready for";
  ct.innerHTML = `Court <b>${esc(primary.court)}</b>`;

  // ETA — when our item there is likely to reach
  const tmin = primary.mins==null ? null : Math.max(0,Math.round(primary.mins));
  if(isNow || tmin===0){ etaN.textContent="on"; etaU.textContent="now"; eta.classList.remove("hidden"); }
  else if(tmin!=null){ etaN.textContent="~"+tmin; etaU.textContent="min"; eta.classList.remove("hidden"); }
  else eta.classList.add("hidden");

  // what's on there vs our item
  const cur=bc[primary.court]?.item;
  sub.innerHTML = (cur?`Item <b>${esc(cur)}</b> on · `:"") + `our item <b>${esc(primary.e.itemNo)}</b>`
    + (primary.k.po ? ` · <b style="color:#8a5a12">passed over</b>`
        : (!isNow && primary.k.gap!=null ? ` · ${primary.k.gap} item${primary.k.gap===1?"":"s"} away` : ""))
    + (tmin!=null && tmin>0 && !primary.meas ? ` <span style="opacity:.6">(est)</span>` : "");

  // where the Senior is now (relative to where he should go)
  const ss=seniorState();
  if(ss.court){
    const here=String(ss.court)===String(primary.court);
    const w=here?0:Math.max(1,Math.round(walkMin(ss.court,primary.court)));
    const q = ss.mode==="confirmed" ? "" : ss.mode==="inferred" ? " · likely" : " · last seen";
    senEl.className="dir-sen"+(ss.mode==="confirmed"?"":" inferred");
    senEl.innerHTML = here
      ? `<i class="ti ti-user-check"></i> Senior is here${q}`
      : `<i class="ti ti-user-check"></i> Senior in Court ${esc(ss.court)} · ~${w} min walk${q}`;
    senEl.classList.remove("hidden");
  } else senEl.classList.add("hidden");

  // what next — the following matter, and whether to catch both or split up
  const nextC=cands.slice(1).find(c=>String(c.court)!==String(primary.court));
  if(nextC){
    const w=walkMin(primary.court,nextC.court);
    const nm=nextC.mins==null?null:Math.max(0,Math.round(nextC.mins));
    const near=w<=NEAR_MIN;
    const clash = nm!=null && tmin!=null && Math.abs(nm-tmin)<=3 && !near;
    const advice = near ? "next door, <b>take both</b>"
      : clash ? "far & reaching together, <b>send someone</b>"
      : "after this one";
    then.innerHTML=`<i class="ti ti-arrow-right"></i><span>Then <b>Court ${esc(nextC.court)}</b>${nm!=null?` · ~${nm} min`:""} — ${advice}</span>`;
    then.classList.remove("hidden");
  } else then.classList.add("hidden");
}

// one court tile: full island when we have matters there, mini otherwise
function boardCell(c, senCourt, senMode){
  const idle=/not in session/i.test(c.status||"");
  const ours=courtMatters().filter(e=>String(e.courtNo)===String(c.court));
  const sen = senCourt && String(senCourt)===String(c.court);
  const live = sen && senMode==="confirmed";
  const senCls = sen ? " sen"+(live?" senlive":"") : "";
  const pin = sen ? `<span class="senpin${live?"":" inferred"}"><i class="ti ti-user-check"></i><span class="lab">${live?"Senior here":"Likely here"}</span></span>` : "";
  if(!ours.length){
    return `<div class="cell mini ${idle?"idle":""}${senCls}" data-court="${esc(c.court)}">
      ${pin}
      <div class="cell-ct">Court <span class="ctn">${esc(c.court)}</span></div>
      <div class="cell-item">${idle?"—":esc(c.item||"·")}</div></div>`;
  }
  const ks=ours.map(e=>({e,k:classify(e,c)})).sort((a,b)=>(TIER_RANK[a.k.tier]-TIER_RANK[b.k.tier])||((a.k.gap??999)-(b.k.gap??999)));
  const tier=ks[0].k.tier;
  // a matter marked over (attended / not attended) is struck through here
  const items=ks.map(x=> x.k.done ? `<s>${esc(x.e.itemNo)}</s>` : esc(x.e.itemNo)).join(" · ");
  return `<div class="cell ours ${tier} ${idle?"idle":""}${senCls}" data-court="${esc(c.court)}">
    ${pin}
    <div class="cell-ct">Court <span class="ctn">${esc(c.court)}</span></div>
    <div class="cell-item">${idle?"—":esc(c.item||"·")}</div>
    <div class="cell-sub">${idle?"not sitting":esc(c.status||"hearing")}</div>
    <div class="cell-ours"><span class="oi">${items}</span><br>${esc(ks[0].k.short||ks[0].k.label)}</div></div>`;
}
function renderBoard(){
  paintFresh(); renderRoute();

  let h="";
  if(boardErr && boardErr!=="relay-unset") h+=`<div class="notice"><b>Can't reach the board</b> — retrying every 15 seconds.</div>`;
  if(!board.length){ $("main").innerHTML=h+`<div class="empty">Loading the display board…</div>`; return; }
  const ourCourts=new Set(courtMatters().map(e=>String(e.courtNo)));
  if(ourCourts.size) h+=`<div class="legend">
    <span><i style="background:var(--now)"></i>at our item</span>
    <span><i style="background:var(--soon)"></i>approaching</span>
    <span><i style="background:var(--later)"></i>later</span>
    <span><i style="background:var(--passed)"></i>over</span>
  </div>`;
  // Only the 17 courtrooms — never the Registrar / administrative list (courts
  // >17), even if we have a matter there (owner: no registrar under the court
  // headings; those still show in "Our list"). Our courts render first at full
  // size; the rest shrink to minis — all fit one screen, no scrolling.
  const ss=seniorState(), senCourt=ss.court, senMode=ss.mode;
  const shown=[...board].filter(c=>isCourtroom(c.court));
  const byNo=(a,b)=>(parseInt(a.court)||999)-(parseInt(b.court)||999);
  const full=shown.filter(c=>ourCourts.has(String(c.court))).sort(byNo);
  const mini=shown.filter(c=>!ourCourts.has(String(c.court))).sort(byNo);
  h+=`<div class="grid">`+full.map(c=>boardCell(c,senCourt,senMode)).join("")+`</div>`;
  if(mini.length) h+=`<div class="grid" style="margin-top:7px">`+mini.map(c=>boardCell(c,senCourt,senMode)).join("")+`</div>`;

}

// A fresh window every day: the chat only ever shows TODAY's messages. Anything
// from an earlier day is never displayed, and is purged best-effort (see below).
const msgDay = m => { const ms=tsMs(m.at); return ms?new Date(ms).toLocaleDateString('en-CA'):todayISO(); };
const todayMsgs = () => Object.values(messages).filter(m=>msgDay(m)===todayISO()).sort((a,b)=>tsMs(a.at)-tsMs(b.at));
const clockIST = ms => { try{ return new Date(ms).toLocaleTimeString('en-GB',{timeZone:'Asia/Kolkata',hour12:false,hour:'2-digit',minute:'2-digit'}); }catch(e){ return ""; } };
// Delete messages older than today so the collection doesn't grow forever. Rules
// let a member remove their OWN messages and let Staff/PA/admin remove anyone's —
// so a manager opening the board clears the shared history fully, a colleague
// clears their own. Either way the day-filter above already hides the rest. Once
// per session, and never blocks the UI.
let _chatPurged=false;
async function purgeOldChat(){
  if(_chatPurged || !me) return; _chatPurged=true;
  const old=Object.values(messages).filter(m=>msgDay(m)<todayISO());
  for(const m of old){ try{ await db.remove("messages/"+m.id); }catch(e){} }
}
function chatListHtml(){
  const list=todayMsgs();
  if(!list.length) return `<div class="empty">No messages yet today.<br>Coordinate here — everyone in the chamber sees it live.</div>`;
  const dayLabel=new Date().toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});
  let html=`<div class="chat-day">Today · ${esc(dayLabel)}</div>`;
  let lastBy=null, lastMs=0;
  for(const m of list){
    const mine=m.by===me?.uid, ms=tsMs(m.at);
    const grp = m.by===lastBy && (ms-lastMs)<4*60000;          // same sender within 4 min → group
    html += `<div class="msg ${mine?"mine ":""}${grp?"grp":""}">`
      + ((!mine&&!grp)?`<div class="who">${esc(m.name||"—")}</div>`:"")
      + `<div class="tx">${esc(m.text)}</div><div class="tm">${clockIST(ms)}</div></div>`;
    lastBy=m.by; lastMs=ms;
  }
  return html;
}
// Repaint only the message list — never the composer — so an incoming message
// can't wipe what a colleague is typing or steal focus. Keeps the view pinned to
// the newest message unless the reader has scrolled up to read history.
function paintChatList(){
  const cl=$("chatList"); if(!cl) return;
  const nearBottom = cl.scrollHeight-cl.scrollTop-cl.clientHeight < 80;
  cl.innerHTML=chatListHtml();
  if(nearBottom) cl.scrollTop=cl.scrollHeight;
}
function renderChat(){
  $("main").innerHTML=`<div id="chatWrap"><div id="chatList">${chatListHtml()}</div>
    <div class="chatbar"><input id="chatIn" placeholder="Message the chamber…" autocomplete="off" maxlength="1000">
    <button id="chatSend" aria-label="Send"><i class="ti ti-send"></i></button></div></div>`;
  const cl=$("chatList"); cl.scrollTop=cl.scrollHeight;
  $("chatSend").onclick=sendChat;
  $("chatIn").onkeydown=ev=>{ if(ev.key==="Enter"&&!ev.shiftKey){ ev.preventDefault(); sendChat(); } };
  $("chatIn").focus();
  lastSeenChat=Date.now(); updateChatBadge(); purgeOldChat();
}
async function sendChat(){
  const inp=$("chatIn"); const t=(inp.value||"").trim(); if(!t) return; inp.value=""; inp.focus();
  await db.add("messages",{by:me.uid,name:me.name||"",text:t.slice(0,1000),at:db.now(),day:todayISO()});
}
function updateChatBadge(){
  const unseen=todayMsgs().filter(m=>tsMs(m.at)>lastSeenChat && m.by!==me?.uid).length;
  const b=$("chatBadge");
  if(unseen>0 && curTab!=="chat"){ b.textContent=unseen; b.classList.remove("hidden"); } else b.classList.add("hidden");
}

/* ============================================================
   DETAIL SHEETS — court island → sequence / passovers / totals /
   our matters; our matter → full details + passover marking
   ============================================================ */
async function loadCourtUpdates(){
  // totals per court come from the chamber's fetched causelist (same repo)
  for(const p of ["court-updates.json","../court-updates.json"]){
    try{ const r=await fetch(p+"?_="+Date.now(),{cache:"no-store"});
      if(r.ok){ courtUpdates=await r.json(); return; } }catch(e){}
  }
}
function totalsFor(court){
  const lists=courtUpdates?.by_date?.[todayISO()]?.lists||{};
  const out=[];
  for(const [type,courts] of Object.entries(lists)){
    if(/registrar/i.test(type)) continue;                  // owner: no registrar in the board app
    const rec=courts?.[String(court)];
    if(rec?.total) out.push(type+": "+rec.total);
  }
  return out;
}
function closeModal(){ $("modalRoot").innerHTML=""; }
function openCourtModal(court,_refetched){
  court=String(court);
  const bc=boardByCourt()[court];
  // Pull this court's full-list remarks fresh on open (even courts we're not in),
  // then re-render once when they arrive — so OVER / PASS OVER is up to date.
  if(!_refetched && bc?.token) fetchRemarksFor(court,bc.token,true).then(()=>{
    if($("modalRoot").querySelector(`.sheet[data-court="${court}"]`)) openCourtModal(court,true);
  });
  const idle=bc?/not in session/i.test(bc.status||""):true;
  const {seq,passIdx}=seqInfo(bc?.sequence||"");
  const ours=courtMatters().filter(e=>String(e.courtNo)===court);
  const senCourt=seniorState().court;
  let h=`<div class="ovl" data-close><div class="sheet" data-court="${esc(court)}"><div class="sheet-grab"></div>
    <h2>Court ${esc(court)} <span class="chip">${idle?"not sitting":"item "+esc(bc?.item||"·")}</span></h2>
    <div class="sh-sub">${idle?"Not in session":esc(bc?.status||"Hearing")+(bc?.caseNo?" · "+esc(bc.caseNo):"")}</div>`;
  if(ours.length){
    h+=`<div class="sh-sec">Our matters here</div>`;
    for(const e of ours){
      const k=classify(e,bc);
      h+=`<div class="sh-matter" data-matter="${esc(court)}|${esc(e.itemNo)}">
        <div class="mi">${esc(e.itemNo)}</div><div class="mt">${esc(shortTitle(e))}</div>
        <span class="badge2 ${k.tier}" style="flex:none">${esc(k.short||"")}</span></div>`;
    }
  }
  h+=`<div class="sh-sec">Declared sequence</div>
    <div class="sh-box">${bc?.sequence?esc(bc.sequence):"No sequence declared — runs in listed order."}</div>`;
  h+=`<div class="sh-sec">Passovers</div><div class="sh-box">`;
  const poHere=Object.entries(poMarks()).filter(([k])=>k.startsWith(court+"_")).map(([k,v])=>({item:k.split("_")[1],...v}));
  // Passed-over items the court itself publishes in its list's remark column.
  const rmk=remarksByCourt[court];
  const detailPO = rmk&&rmk.items ? Object.keys(rmk.items).filter(i=>/pass\s*over/i.test(rmk.items[i])) : [];
  const poBits=[];
  if(detailPO.length) poBits.push("Court's list shows passed over: <b>"+detailPO.map(esc).join(", ")+"</b>");
  else if(bc?.token && !rmk) poBits.push(`<span style="color:var(--mut)">Reading the court's list…</span>`);
  if(poHere.length) poBits.push("Marked by chamber: <b>"+poHere.map(p=>p.item+(p.mode==="after"&&p.after?" (after "+esc(p.after)+")":"")).join(", ")+"</b>");
  poBits.push(passIdx!=null?"Sequence recalls passovers after <b>item "+esc(String(seq[passIdx-1]??"start"))+"</b>.":"Recall position not declared — assumed end of board.");
  h+=poBits.join("<br>")+`</div>`;
  const tots=totalsFor(court);
  if(tots.length) h+=`<div class="sh-sec">Total matters today</div><div class="sh-box">${tots.map(esc).join("<br>")}</div>`;
  if(!isSenior()) h+=`<button class="sh-btn navy" data-senhere="${esc(court)}">${String(senCourt)===court?"Senior is here ✓":"Senior is in Court "+esc(court)}</button>`;
  h+=`<button class="sh-btn" data-close>Close</button></div></div>`;
  $("modalRoot").innerHTML=h;
}
function openMatterModal(court,item){

async function setSeniorCourt(court){
  if(!court) return;
  await db.set("config/live",{ court:{court:String(court),at:db.now(),by:me.uid} }, true);
}
function boot(user){
  unsub.forEach(u=>u&&u()); unsub=[]; if(userDocUnsub){userDocUnsub();userDocUnsub=null;}
  if(!user){ me=null; $("app").classList.add("hidden"); $("login").classList.remove("hidden"); stopPolling(); return; }
  const uid=user.uid;
  userDocUnsub=db.watchDoc("users/"+uid, u=>{
    me = u ? {uid,...u} : {uid,role:"pending",name:user.email};
    if(emailKey(me.email||user.email)===emailKey(CHAMBER.adminEmail)) me.role="admin";
    if(!bootStarted){ bootStarted=true; startWatchers(); }
    gateUI();
  });
}
let bootStarted=false;
function startWatchers(){
  unsub.push(db.watchCollection("users",rows=>{ users={}; rows.forEach(u=>users[u.id]=u); scheduleRender(); }));
  unsub.push(db.watchDoc("config/live", d=>{ live=d||{}; delete live.id; scheduleRender(); }));
  unsub.push(db.watchCollection("messages",rows=>{ messages={}; rows.forEach(m=>messages[m.id]=m); updateChatBadge(); if(curTab==="chat") paintChatList(); purgeOldChat(); }));
  unsub.push(db.watchDoc("daysheets/"+todayISO(), d=>{ daysheet=d||{entries:[]}; scheduleRender(); }));
  loadCourtUpdates();
  startPolling();
}
function gateUI(){
  const approved = me && ["admin","senior","clerk","pa","junior"].includes(me.role);
  $("login").classList.toggle("hidden", !!approved);
  $("app").classList.toggle("hidden", !approved);
  if(approved){ render(); initNotify(); }
  else if(me){ $("lgErr").textContent = me.role==="pending" ? "Your account isn't approved yet. Ask Adith to add you." : ""; }
}
