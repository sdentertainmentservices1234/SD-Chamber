<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#141a22">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>SD Court Display Board</title>
<link rel="manifest" href="board-manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.5.0/dist/tabler-icons.min.css">
<style>
/* ---- SD Court Display Board — the familiar SC board (all courts + current
   item), light theme, with our chamber's matters colour-coded on it. ---- */
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap');
:root{
  --bg:#e9ecef; --panel:#ffffff; --panel2:#f3f5f7; --ink:#161a1f; --mut:#697682;
  --line:#d5dae0; --navy:#141a22; --accent:#2f5596; --gold:#b09456;
  --now:#d23a34;  --now-bg:#fbe7e5;
  --soon:#c1820f; --soon-bg:#fbf1d8;
  --later:#3c8654; --later-bg:#e7f3eb;
  --idle:#98a2ac; --idle-bg:#eef1f4; --passed:#7a8591;
  --shadow:0 1px 3px rgba(20,26,34,.08),0 4px 16px rgba(20,26,34,.06);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;
  -webkit-text-size-adjust:100%;touch-action:manipulation}
body{background:var(--navy);color:var(--ink);font-family:Inter,system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;overflow:hidden;position:fixed;inset:0}
.mono{font-family:'IBM Plex Mono',monospace}
button{font-family:inherit;cursor:pointer}
.hidden{display:none!important}

/* ---- login ---- */
#login{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(180deg,#f5f7f9,#e4e8ec);padding:20px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;
  padding:30px 26px;width:min(400px,100%);box-shadow:var(--shadow)}
.seal{width:60px;height:60px;border-radius:50%;background:var(--navy);border:2px solid var(--gold);
  display:flex;align-items:center;justify-content:center;margin:0 auto 14px;
  font-family:Fraunces,serif;color:var(--gold);font-weight:600;font-size:24px}
.card h1{font-family:Fraunces,serif;font-weight:600;font-size:22px;margin:0 0 2px;text-align:center;color:var(--ink)}
.card .sub{color:var(--mut);text-align:center;font-size:13px;margin-bottom:20px}
.card label{display:block;font-size:12px;color:var(--mut);margin:12px 0 5px;font-weight:500}
.card input{width:100%;padding:11px 13px;border-radius:10px;border:1px solid var(--line);
  background:var(--panel2);color:var(--ink);font-size:15px}
.card input:focus{outline:none;border-color:var(--accent)}
.btn{width:100%;padding:12px;border:none;border-radius:10px;background:var(--accent);color:#fff;
  font-weight:600;font-size:15px;margin-top:18px}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--mut);margin-top:9px}
.err{color:var(--now);font-size:13px;margin-top:12px;min-height:16px;text-align:center}

/* ---- app shell ---- */
/* Fixed app shell: header + bottom nav never move; only <main> scrolls.
   100dvh tracks the phone's dynamic viewport so nothing is left blank. */
#app{display:flex;flex-direction:column;height:100vh;height:100dvh;max-width:760px;width:100%;
  margin-inline:auto;background:var(--bg);overflow:hidden}
@media(min-width:761px){ body{background:#d3d8dd} #app{border-inline:1px solid var(--line)} }

header.top{display:flex;align-items:center;gap:10px;
  padding:calc(env(safe-area-inset-top,0px) + 11px) 15px 11px;
  background:var(--navy);color:#fff;flex:none}
.top .ttl{font-family:Fraunces,serif;font-weight:600;font-size:17px;letter-spacing:.2px;line-height:1.05}
.top .ttl small{display:block;font-family:Inter;color:#9fb0c0;font-size:10px;font-weight:500;letter-spacing:.4px;text-transform:uppercase;margin-top:1px}
.top .spacer{flex:1}
.freshpill{font-size:11px;color:#aeb9c4;display:flex;align-items:center;gap:5px;white-space:nowrap}
.freshdot{width:7px;height:7px;border-radius:50%;background:#4bbd6b;box-shadow:0 0 0 0 rgba(75,189,107,.6);animation:pulse 2s infinite}
.freshdot.stale{background:var(--soon);animation:none}
.freshdot.off{background:#7d8894;animation:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(75,189,107,.5)}70%{box-shadow:0 0 0 7px rgba(75,189,107,0)}100%{box-shadow:0 0 0 0 rgba(75,189,107,0)}}
.iconbtn{background:transparent;border:none;color:#cdd6df;font-size:21px;padding:5px;line-height:1;border-radius:8px}
.iconbtn:active{background:rgba(255,255,255,.1)}
.iconbtn.spin i{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* board-tab header strip: nearest directive + senior */
#paneTop{flex:none;padding:12px 15px 0}
.headline{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);
  border-left:5px solid var(--accent);border-radius:12px;padding:11px 13px;box-shadow:var(--shadow)}
.headline.go{border-left-color:var(--now);background:var(--now-bg)}
.headline.clear{border-left-color:var(--later)}
.headline .hl-ct{font-family:'IBM Plex Mono';font-size:28px;font-weight:700;color:var(--accent);
  flex:none;min-width:52px;text-align:center;line-height:1}
.headline.go .hl-ct{color:var(--now)}
.headline .hl-main{font-family:Fraunces,serif;font-weight:600;font-size:18px;line-height:1.12}
.headline .hl-sub{font-size:12px;color:var(--mut);margin-top:2px}

.seniorbar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-top:9px;
  background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:8px 11px}
.seniorbar .lab{font-size:12px;color:var(--mut)}
.seniorbar .loc{font-weight:700;font-size:14px}
.seniorbar .tag{font-size:9.5px;text-transform:uppercase;letter-spacing:.5px;padding:2px 7px;border-radius:20px;font-weight:700}
.tag.inferred{background:#f3ead0;color:#8a6d1a}
.tag.confirmed{background:#e0f0e6;color:#2c6b41}
.tag.stale{background:#f6ecd6;color:#946a12}
.seniorbar .spacer{flex:1}
.mini{font-size:12px;padding:7px 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
.mini.gold{border-color:var(--gold);color:#7a6320;background:#fbf6ea;font-weight:600}
select.mini{appearance:none}

/* status row (date + freshness) */
.statusrow{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--mut);padding:2px 3px 0}
/* senior location line (colleagues only; the Senior doesn't see it) */
.seniorLine{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12.5px;color:var(--ink);
  background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:8px 11px;margin-top:9px;box-shadow:var(--shadow)}
.seniorLine i{color:var(--navy);font-size:15px}
.seniorLine .hint{color:var(--mut);font-size:11px;font-weight:400}
.senpin{position:absolute;top:5px;left:5px;width:21px;height:21px;border-radius:50%;background:var(--navy);
  color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;z-index:2;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.cell.sen{box-shadow:var(--shadow),0 0 0 2px var(--navy)}
.cell[data-setcourt]{cursor:pointer}
.cell[data-setcourt]:active{transform:scale(.97)}

main{flex:1;overflow-y:auto;padding:12px 15px 16px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}

/* legend */
.legend{display:flex;gap:13px;font-size:10.5px;color:var(--mut);margin:0 2px 11px;flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none}

/* ===== the display board grid — every court, its current item ===== */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.cell{background:var(--panel);border:1px solid var(--line);border-radius:12px;
  padding:9px 6px 10px;text-align:center;position:relative;min-height:92px;
  display:flex;flex-direction:column;box-shadow:var(--shadow)}
.cell-ct{font-size:10px;font-weight:700;color:var(--navy);letter-spacing:.4px;text-transform:uppercase}
.cell-item{font-family:'IBM Plex Mono';font-size:30px;font-weight:700;color:var(--ink);line-height:1.02;margin-top:2px}
.cell-sub{font-size:9px;color:var(--mut);text-transform:uppercase;letter-spacing:.3px;margin-top:3px}
.cell.idle{background:var(--idle-bg)}
.cell.idle .cell-item{color:var(--idle);font-weight:600}
/* our courts — colour-coded, shifts as our item nears */
.cell.ours{border-width:2px}
.cell.ours.now{border-color:var(--now);background:var(--now-bg);animation:blink 1.25s ease-in-out infinite}
.cell.ours.soon{border-color:var(--soon);background:var(--soon-bg)}
.cell.ours.later{border-color:var(--later);background:var(--later-bg)}
.cell.ours.passed{border-color:var(--passed);background:var(--idle-bg)}
.cell.ours.idle{border-color:var(--idle)}
@keyframes blink{0%,100%{box-shadow:0 0 0 0 rgba(210,58,52,0)}50%{box-shadow:0 0 0 4px rgba(210,58,52,.35)}}
.cell-ours{margin-top:6px;font-size:10.5px;font-weight:700;border-radius:7px;padding:3px 4px;line-height:1.25;color:#fff}
.cell-ours .oi{font-family:'IBM Plex Mono';font-size:12px}
.cell.ours.now  .cell-ours{background:var(--now)}
.cell.ours.soon .cell-ours{background:var(--soon)}
.cell.ours.later .cell-ours{background:var(--later)}
.cell.ours.passed .cell-ours{background:var(--passed)}
.cell.ours.idle  .cell-ours{background:var(--idle)}

/* our list (causelist) */
.li{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px 13px;
  margin-bottom:9px;display:flex;gap:12px;box-shadow:var(--shadow)}
.li .ci{flex:none;text-align:center;min-width:48px}
.li .ci .c{font-family:'IBM Plex Mono';font-size:11px;color:var(--mut)}
.li .ci .i{font-family:'IBM Plex Mono';font-size:21px;font-weight:700}
.li .badge2{font-size:9.5px;font-weight:700;border-radius:6px;padding:2px 5px;margin-top:3px;color:#fff;display:inline-block}
.li .badge2.now{background:var(--now)} .li .badge2.soon{background:var(--soon)}
.li .badge2.later{background:var(--later)} .li .badge2.passed{background:var(--passed)}
.li .badge2.idle{background:var(--idle)} .li .badge2.unknown{background:var(--idle)}
.li .d{flex:1;min-width:0}
.li .t{font-weight:700;font-size:13.5px;margin-bottom:2px}
.li .m{font-size:11.5px;color:var(--mut);line-height:1.5}
.li .m b{color:var(--ink);font-weight:600}

/* chat */
#chatWrap{display:flex;flex-direction:column;height:100%}
#chatList{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding-bottom:8px}
.msg{max-width:82%;padding:8px 12px;border-radius:13px;background:var(--panel);border:1px solid var(--line);align-self:flex-start;box-shadow:var(--shadow)}
.msg.mine{align-self:flex-end;background:#e7effb;border-color:#c9dcf3}
.msg .who{font-size:11px;color:#8a6d1a;font-weight:700;margin-bottom:2px}
.msg.mine .who{color:var(--accent)}
.msg .tx{font-size:14px;line-height:1.35;word-wrap:break-word;color:var(--ink)}
.msg .tm{font-size:10px;color:var(--mut);margin-top:3px;text-align:right}
.chatbar{display:flex;gap:8px;padding-top:8px;border-top:1px solid var(--line);flex:none}
.chatbar input{flex:1;padding:11px 14px;border-radius:22px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-size:15px}
.chatbar input:focus{outline:none;border-color:var(--accent)}
.chatbar button{border:none;background:var(--accent);color:#fff;width:44px;height:44px;border-radius:50%;font-size:19px;flex:none}

.empty{text-align:center;color:var(--mut);padding:40px 20px;font-size:14px}
.notice{background:var(--soon-bg);border:1px solid #e6d29a;color:#8a6410;border-radius:11px;padding:11px 13px;font-size:12.5px;margin-bottom:12px;line-height:1.45}

/* ===== bottom navigation (mobile-standard) ===== */
nav.botnav{flex:none;display:flex;background:var(--panel);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px)}
nav.botnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;
  background:transparent;border:none;color:var(--mut);font-size:11px;font-weight:600;
  padding:9px 4px 8px;position:relative}
nav.botnav button i{font-size:22px;line-height:1}
nav.botnav button.on{color:var(--accent)}
nav.botnav .badge{position:absolute;top:4px;left:calc(50% + 8px);background:var(--now);color:#fff;
  border-radius:20px;font-size:9px;padding:1px 5px;min-width:15px;line-height:1.4}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login">
  <div class="card">
    <div class="seal">SD</div>
    <h1 id="lgName">Chamber Display Board</h1>
    <div class="sub">Live Supreme Court board · for the chamber</div>
    <label>Email</label>
    <input id="lgEmail" type="email" autocomplete="username" placeholder="you@example.com">
    <label>Password</label>
    <input id="lgPass" type="password" autocomplete="current-password" placeholder="••••••••">
    <button class="btn" id="lgGo">Sign in</button>
    <button class="btn ghost" id="lgReset">Forgot password</button>
    <div class="err" id="lgErr"></div>
  </div>
</div>

<!-- APP -->
<div id="app" class="hidden">
  <header class="top">
    <div class="ttl"><span id="hdrName">Chambers of Shyam Divan</span><small id="hdrSub">Senior Advocate · Supreme Court of India</small></div>
    <div class="spacer"></div>
    <button class="iconbtn" id="btnRefresh" title="Refresh"><i class="ti ti-refresh"></i></button>
    <button class="iconbtn" id="btnOut" title="Sign out"><i class="ti ti-logout"></i></button>
  </header>

  <div id="paneTop">
    <div class="statusrow"><span class="freshdot off" id="freshDot"></span><span id="statusTxt">connecting…</span></div>
    <div class="headline" id="directive">
      <div class="hl-ct" id="dirCt">—</div>
      <div><div class="hl-main" id="dirBig">Reading the board…</div><div class="hl-sub" id="dirSub"></div></div>
    </div>
    <div class="seniorLine hidden" id="seniorLine"></div>
  </div>

  <main id="main"></main>

  <nav class="botnav">
    <button data-tab="board" class="on"><i class="ti ti-layout-grid"></i>Board</button>
    <button data-tab="list"><i class="ti ti-list-details"></i>Our list</button>
    <button data-tab="chat"><i class="ti ti-messages"></i>Chat<span class="badge hidden" id="chatBadge">0</span></button>
  </nav>
</div>

<script type="module">
/* ============================================================
   SD Court Display Board — configuration (mirrors index.html)
   ============================================================ */
const DEMO = false;
const BOARD_PROXY = "https://sd-board.sdentertainmentservices.workers.dev";
const BOARD_SAMPLE = null;

const CHAMBER = {
  seniorName: "Shyam Divan",
  designation: "Senior Advocate",
  court: "Supreme Court of India",
  adminEmail: "adithdeshmukh@gmail.com"
};
const firebaseConfig = {
  apiKey: "AIzaSyAagQ_-1LLvKtmsfJwSPJvURHWB-FkO-NQ",
  authDomain: "sd-chamber-1aa78.firebaseapp.com",
  projectId: "sd-chamber-1aa78",
  storageBucket: "sd-chamber-1aa78.firebasestorage.app",
  messagingSenderId: "287957629475",
  appId: "1:287957629475:web:9c7804acf3060c73abcf96"
};

/* ---- helpers ---- */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const todayISO = () => new Date().toLocaleDateString('en-CA');
const emailKey = e => (e||"").trim().toLowerCase();
const tsMs = x => x?._t ?? (x?.toDate ? x.toDate().getTime() : (typeof x==="number"?x:0)) ?? 0;
const agoTxt = ms => { const s=Math.max(0,Math.round((Date.now()-ms)/1000));
  if(s<60) return s+"s ago"; const m=Math.round(s/60); if(m<60) return m+"m ago"; return Math.round(m/60)+"h ago"; };

// Mentioning ("MM") matters are called in the first ~10 min after 10:30 and are
// done by 10:40 — never flash them; drop them from the directive once past.
const MENT_START=630, MENT_END=640;                 // 10:30 – 10:40, minutes IST
function nowMinsIST(){
  try{ const t=new Date().toLocaleTimeString('en-GB',{timeZone:'Asia/Kolkata',hour12:false,hour:'2-digit',minute:'2-digit'});
    const [h,m]=t.split(':').map(Number); return h*60+m; }
  catch(e){ const d=new Date(); return d.getHours()*60+d.getMinutes(); }
}
const isMentioning = item => { const s=String(item||"").trim(); return s!=="" && !/^\d/.test(s); };

/* ============================================================
   BOARD ENGINES — validated offline against the live SC sample
   ============================================================ */
function parseBoard(html){
  const strip = s => s.replace(/<[^>]+>/g," ").replace(/&nbsp;/g," ").replace(/&amp;/g,"&")
    .replace(/&#039;|&apos;/g,"'").replace(/&quot;/g,'"').replace(/&gt;/g,">").replace(/&lt;/g,"<")
    .replace(/\s+/g," ").trim();
  const rows = html.split(/<tr class="record">/i).slice(1);
  const courts = [];
  for (let raw of rows){
    raw = raw.split(/<\/tr>/i)[0];
    let court=""; let m=raw.match(/btn-primary[^>]*>\s*([0-9]+)/i); if(m) court=m[1];
    if(!court){ const im=raw.match(/id="cl_(\d+)"/i); if(im) court=im[1]; }
    const cl=raw.match(/id="cl_\d+"[^>]*>(.*?)<\/td>/is); const cltext=cl?strip(cl[1]):"";
    let item="", status=cltext; const im2=cltext.match(/^(\d+(?:\.\d+)?)\s+(.*)$/);
    if(im2){ item=im2[1]; status=im2[2].trim(); }
    const cn=raw.match(/id="cn_\d+"[^>]*>(.*?)<\/td>/is);
    const cz=raw.match(/id="cnbz_\d+"[^>]*>(.*?)<\/td>/is);
    const seqm=raw.match(/title="([^"]*(?:SEQUENCE|SEQ|sequence)[^"]*)"/i);
    if(!court) continue;
    courts.push({ court, item, status, caseNo:cn?strip(cn[1]):"", title:cz?strip(cz[1]):"",
      sequence:seqm?strip(seqm[1]):"" });
  }
  return { courts };
}
function expandSequence(text){
  if(!text) return [];
  const toks=text.toUpperCase().replace(/[^0-9A-Z. ]/g," ").split(/\s+/).filter(Boolean);
  const out=[], seen=new Set(); const push=n=>{ if(!seen.has(n)){seen.add(n);out.push(n);} };
  for(let i=0;i<toks.length;i++){
    const num=toks[i].match(/^(\d+)(?:\.\d+)?$/); if(!num) continue;
    const a=parseInt(num[1],10);
    if(toks[i+1]==="TO" && /^\d+$/.test(toks[i+2]||"")){
      const b=parseInt(toks[i+2],10);
      if(b>=a && b-a<600){ for(let k=a;k<=b;k++) push(k); } else push(a); i+=2;
    } else push(a);
  }
  return out;
}
function proximity(seq,current,ours){
  current=parseInt(current,10); ours=Math.floor(parseFloat(ours));
  if(!seq.length||isNaN(current)||isNaN(ours)) return null;
  const curPos=seq.indexOf(current), ourPos=seq.indexOf(ours);
  if(curPos<0||ourPos<0) return {gap:null,of:seq.length,ourPos,curPos};
  return {gap:ourPos-curPos,of:seq.length,ourPos,curPos};
}
// classify our matter against its board court -> {tier,label,short,gap,approx,ment}
function classify(e, bc){
  const ours=e.itemNo;
  if(!bc) return {tier:"unknown",label:"court not on the board",short:"—"};
  if(/not in session/i.test(bc.status||"")) return {tier:"idle",label:"court not sitting",short:"not sitting"};
  if(isMentioning(ours)){
    if(nowMinsIST()>MENT_END) return {tier:"passed",label:"mentioning — done",short:"done",ment:true};
    return {tier:"soon",label:"mentioning — watch",short:"watch",gap:0,ment:true};
  }
  const oursNum=parseFloat(ours);
  const seq=expandSequence(bc.sequence);
  let gap=null, approx=false;
  const p=proximity(seq,bc.item,ours);
  if(p && p.gap!=null) gap=p.gap;
  else { const c=parseFloat(bc.item); if(!isNaN(c)){ gap=Math.floor(oursNum)-Math.floor(c); approx=true; } }
  if(gap==null) return {tier:"unknown",label:"position unclear",short:"—"};
  if(gap<0) return {tier:"passed",label:"likely already passed",short:"passed",gap,approx};
  if(gap<=1) return {tier:"now",label:gap===0?"ITEM ON NOW":"NEXT — get in",short:gap===0?"NOW":"NEXT",gap,approx};
  if(gap<=4) return {tier:"soon",label:"~"+gap+" items away",short:gap+" away",gap,approx};
  return {tier:"later",label:gap+" items away",short:gap+" away",gap,approx};
}
const TIER_RANK={now:0,soon:1,later:2,unknown:3,passed:4,idle:5};

/* ============================================================
   DATA LAYER — Firebase (prod) / in-memory mock (demo)
   ============================================================ */
let db, auth;
if(DEMO){
  const now=()=>({_t:Date.now()}); let idc=1; const gid=()=>"g"+(idc++);
  const store=new Map(); const C=p=>{ if(!store.has(p)) store.set(p,new Map()); return store.get(p); };
  const subs=[]; const split=p=>{const a=p.split("/");const id=a.pop();return[a.join("/"),id];};
  const exists=(cp,id)=>C(cp).has(id);
  function rows(p,order){ let r=[...C(p).entries()].map(([id,d])=>({id,...d}));
    if(order){const[f,dir]=order;r.sort((a,b)=>{const av=a[f]?._t??a[f]??0,bv=b[f]?._t??b[f]??0;return dir==="desc"?(av<bv?1:av>bv?-1:0):(av>bv?1:av<bv?-1:0);});} return r; }
  const emitColl=p=>subs.filter(s=>!s.doc&&s.path===p).forEach(s=>s.cb(rows(p,s.order)));
  const emitDoc=p=>subs.filter(s=>s.doc&&s.path===p).forEach(s=>{const[cp,id]=split(p);s.cb(exists(cp,id)?{id,...C(cp).get(id)}:null);});
  db={ watchCollection(path,cb,order){const s={path,cb,order,doc:false};subs.push(s);cb(rows(path,order));return()=>subs.splice(subs.indexOf(s),1);},
    watchDoc(path,cb){const s={path,cb,doc:true};subs.push(s);const[cp,id]=split(path);cb(exists(cp,id)?{id,...C(cp).get(id)}:null);return()=>subs.splice(subs.indexOf(s),1);},
    async set(path,data,merge){const[cp,id]=split(path);const m=C(cp);m.set(id,merge?{...(m.get(id)||{}),...data}:{...data});emitColl(cp);emitDoc(path);},
    async add(path,data){const id=gid();C(path).set(id,{...data});emitColl(path);return id;},
    async update(path,data){const[cp,id]=split(path);const m=C(cp);m.set(id,{...(m.get(id)||{}),...data});emitColl(cp);emitDoc(path);},
    async remove(path){const[cp,id]=split(path);C(cp).delete(id);emitColl(cp);}, now };
  let authCb=null,cur={uid:"u_yash"};
  auth={ onChange(cb){authCb=cb;setTimeout(()=>cb(cur),0);}, signIn(){return Promise.resolve();},
    resetPassword(){return Promise.resolve();}, signOut(){cur=null;authCb&&authCb(null);},
    setUser(uid){cur={uid};authCb&&authCb(cur);} };
  window.__demoSetUser=uid=>auth.setUser(uid);
  seedDemo(db);
} else {
  const [{initializeApp},{getAuth,signInWithEmailAndPassword,createUserWithEmailAndPassword,onAuthStateChanged,signOut,sendPasswordResetEmail},
    {getFirestore,collection,doc,getDoc,setDoc,addDoc,updateDoc,deleteDoc,onSnapshot,query,orderBy,serverTimestamp}] =
    await Promise.all([
      import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js"),
      import("https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js"),
      import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js")
    ]);
  const app=initializeApp(firebaseConfig); const fa=getAuth(app); const fs=getFirestore(app);
  db={ watchCollection(path,cb,order){const c=collection(fs,...path.split("/"));const q=order?query(c,orderBy(order[0],order[1])):c;
      return onSnapshot(q,s=>{const r=[];s.forEach(d=>r.push({id:d.id,...d.data()}));cb(r);});},
    watchDoc(path,cb){return onSnapshot(doc(fs,...path.split("/")),s=>cb(s.exists()?{id:s.id,...s.data()}:null));},
    async set(path,data,merge){await setDoc(doc(fs,...path.split("/")),data,{merge:!!merge});},
    async add(path,data){const r=await addDoc(collection(fs,...path.split("/")),data);return r.id;},
    async update(path,data){await updateDoc(doc(fs,...path.split("/")),data);},
    async remove(path){await deleteDoc(doc(fs,...path.split("/")));}, now:serverTimestamp };
  auth={ onChange(cb){ onAuthStateChanged(fa,async user=>{
      if(user){ const uref=doc(fs,"users",user.uid); const snap=await getDoc(uref);
        if(!snap.exists()){
          let base={name:user.email.split("@")[0],email:user.email,role:"pending",active:true,createdAt:serverTimestamp()};
          if(emailKey(user.email)===emailKey(CHAMBER.adminEmail)) base.role="admin";
          try{ const ap=await getDoc(doc(fs,"approvals",emailKey(user.email)));
            if(ap.exists()){ const a=ap.data(); base={...base,name:a.name||base.name,role:a.role||base.role,phone:a.phone||"",joinedOn:a.joinedOn||null}; }
          }catch(e){}
          try{ await setDoc(uref,base); }catch(e){ try{ await setDoc(uref,{name:user.email.split("@")[0],email:user.email,role:"pending",active:true,createdAt:serverTimestamp()}); }catch(_){} }
        }
      } cb(user); }); },
    signIn(email,pass){return signInWithEmailAndPassword(fa,email,pass);},
    resetPassword(email){return sendPasswordResetEmail(fa,email);},
    signOut(){return signOut(fa);}, setUser(){} };
}

/* ============================================================
   STATE
   ============================================================ */
let me=null, users={}, daysheet=null, live={}, messages={};
let board=[], boardAt=0, boardErr=null;
let curTab="board", lastSeenChat=0, userDocUnsub=null, unsub=[], pollId=null, tickId=null;

const boardByCourt = () => { const m={}; board.forEach(c=>{ if(c.court && !m[c.court]) m[c.court]=c; }); return m; };
const myMatters = () => (daysheet?.entries||[]).filter(e=>e.courtNo);
const shortTitle = e => e.caseTitle || ("Court "+e.courtNo+" item "+e.itemNo);
const isSenior = () => me?.role==="senior";           // the Senior doesn't set/see his own location

/* ============================================================
   BOARD FETCH
   ============================================================ */
async function fetchBoard(){
  try{
    let html="";
    if(BOARD_SAMPLE){ html=await (await fetch(BOARD_SAMPLE,{cache:"no-store"})).text(); }
    else if(BOARD_PROXY){ html=await (await fetch(BOARD_PROXY+"?ctype=c",{cache:"no-store"})).text(); }
    else { boardErr="relay-unset"; renderBoard(); return; }
    const parsed=parseBoard(html);
    if(parsed.courts.length){ board=parsed.courts; boardAt=Date.now(); boardErr=null; }
    else boardErr="empty";
  }catch(e){ boardErr=String(e&&e.message||e); }
  renderBoard();
}
function startPolling(){ stopPolling(); fetchBoard(); pollId=setInterval(fetchBoard,15000);
  tickId=setInterval(paintFresh,1000); }        // 1s tick only ages the freshness label
function stopPolling(){ if(pollId)clearInterval(pollId); if(tickId)clearInterval(tickId); pollId=tickId=null; }

// Refresh: freshest app version AND freshest board. Clears caches + cache-bust
// reload (so an installed PWA can't sit on a stale shell); reload re-pulls board.
async function hardRefresh(){
  const b=$("btnRefresh"); if(b) b.classList.add("spin");
  try{ if("caches" in window){ const ks=await caches.keys(); await Promise.all(ks.map(k=>caches.delete(k))); } }catch(e){}
  try{ if(navigator.serviceWorker){ const rs=await navigator.serviceWorker.getRegistrations(); rs.forEach(r=>r.update&&r.update()); } }catch(e){}
  const u=new URL(location.href); u.searchParams.set("v", String(Date.now()));
  location.replace(u.toString());
}

/* ============================================================
   RENDER
   ============================================================ */
function paintFresh(){
  const dot=$("freshDot"), txt=$("statusTxt");
  if(!dot||!txt) return;
  const day=new Date().toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long'});
  if(boardErr==="relay-unset"){ dot.className="freshdot off"; txt.textContent=day+" · relay not set"; return; }
  if(boardErr){ dot.className="freshdot stale"; txt.textContent=day+" · board offline"; return; }
  if(!boardAt){ dot.className="freshdot off"; txt.textContent=day+" · connecting…"; return; }
  dot.className="freshdot"+((Date.now()-boardAt)>45000?" stale":"");
  txt.textContent=day+" · updated "+agoTxt(boardAt);
}

// senior location: confirmed (config/live.court, fresh <25m) else inferred
function seniorState(){
  const c=live?.court; const at=c?tsMs(c.at):0;
  const fresh=at && (Date.now()-at)<25*60*1000;
  if(c && c.court && fresh) return {court:c.court, mode:"confirmed", at, by:c.by};
  const bc=boardByCourt(); let best=null;
  for(const e of myMatters()){
    const k=classify(e,bc[e.courtNo]);
    if(k.tier==="now"||k.tier==="soon"){ if(!best || (k.gap??99)<(best.gap??99)) best={court:e.courtNo,gap:k.gap}; }
  }
  if(best) return {court:best.court, mode:"inferred"};
  if(c && c.court) return {court:c.court, mode:"stale", at};
  return {court:null, mode:"none"};
}
function renderSenior(){
  const line=$("seniorLine"); if(!line) return;
  if(isSenior()){ line.classList.add("hidden"); return; }   // he doesn't manage his own location
  line.classList.remove("hidden");
  const s=seniorState();
  const loc = s.court ? "Court "+s.court : "not marked";
  const tagCls = s.mode==="confirmed"?"confirmed":s.mode==="stale"?"stale":"inferred";
  const tagTxt = s.mode==="confirmed"?("confirmed "+(s.at?agoTxt(s.at):"")):s.mode==="stale"?"last known":s.mode==="inferred"?"inferred":"";
  line.innerHTML = `<i class="ti ti-user"></i> Senior: <b>${esc(loc)}</b>`
    + (tagTxt?` <span class="tag ${tagCls}">${esc(tagTxt)}</span>`:"")
    + ` <span class="hint">— tap the court he's in</span>`;
}

// nearest actionable matter -> the "head to court X" headline
function nearest(){
  const bc=boardByCourt(); let pick=null;
  for(const e of myMatters()){
    const k=classify(e,bc[e.courtNo]);
    if(k.tier==="now"||k.tier==="soon"){
      if(!pick || TIER_RANK[k.tier]<TIER_RANK[pick.k.tier] || (k.tier===pick.k.tier && (k.gap??99)<(pick.k.gap??99))) pick={e,k};
    }
  }
  return pick;
}
function renderDirective(){
  const dir=$("directive"), ct=$("dirCt"), big=$("dirBig"), sub=$("dirSub"); if(!dir) return;
  if(!board.length){ dir.className="headline"; ct.textContent="—";
    big.textContent = boardErr && boardErr!=="relay-unset" ? "Board offline" : "Reading the board…"; sub.textContent=""; return; }
  const pick=nearest();
  if(!pick){ dir.className="headline clear"; ct.textContent="✓";
    big.textContent="Nothing imminent"; sub.textContent="No chamber matter is close right now."; return; }
  const now = pick.k.tier==="now" && !pick.k.ment;
  dir.className="headline"+(now?" go":"");
  ct.textContent=pick.e.courtNo;
  big.textContent = now ? "Head to Court "+pick.e.courtNo : "Get ready — Court "+pick.e.courtNo;
  sub.innerHTML = "Item "+esc(pick.e.itemNo)+" · "+esc(shortTitle(pick.e))+" — <b>"+esc(pick.k.label)+"</b>";
}

// one court tile on the display board
function boardCell(c, senCourt, canSet){
  const idle=/not in session/i.test(c.status||"");
  const ours=myMatters().filter(e=>String(e.courtNo)===String(c.court));
  let tier="", oursHtml="";
  if(ours.length){
    const ks=ours.map(e=>({e,k:classify(e,c)})).sort((a,b)=>(TIER_RANK[a.k.tier]-TIER_RANK[b.k.tier])||((a.k.gap??999)-(b.k.gap??999)));
    tier=ks[0].k.tier;
    const items=ks.map(x=>esc(x.e.itemNo)).join(" · ");
    oursHtml=`<div class="cell-ours"><span class="oi">${items}</span><br>${esc(ks[0].k.short||ks[0].k.label)}</div>`;
  }
  const sen = senCourt && String(senCourt)===String(c.court);
  const tap = canSet ? ` data-setcourt="${esc(c.court)}"` : "";
  return `<div class="cell ${ours.length?"ours "+tier:""} ${idle?"idle":""} ${sen?"sen":""}"${tap}>
    ${sen?`<span class="senpin"><i class="ti ti-user"></i></span>`:""}
    <div class="cell-ct">Court ${esc(c.court)}</div>
    <div class="cell-item">${idle?"—":esc(c.item||"·")}</div>
    <div class="cell-sub">${idle?"not sitting":esc(c.status||"hearing")}</div>
    ${oursHtml}</div>`;
}
function renderBoard(){
  paintFresh(); renderDirective(); renderSenior();
  if(curTab!=="board") return;
  let h="";
  if(boardErr && boardErr!=="relay-unset") h+=`<div class="notice"><b>Can't reach the board</b> — retrying every 15 seconds.</div>`;
  if(!board.length){ $("main").innerHTML=h+`<div class="empty">Loading the display board…</div>`; return; }
  const ourCourts=new Set(myMatters().map(e=>String(e.courtNo)));
  const anyOurs = ourCourts.size>0;
  if(anyOurs) h+=`<div class="legend">
    <span><i style="background:var(--now)"></i>at our item</span>
    <span><i style="background:var(--soon)"></i>approaching</span>
    <span><i style="background:var(--later)"></i>later</span>
    <span><i style="background:var(--passed)"></i>done</span>
    <span><i style="background:var(--idle-bg);border:1px solid var(--line)"></i>not sitting</span>
  </div>`;
  // Courts 1–17 always; registrar / extra courts (>17) only when we're in them.
  const senCourt = seniorState().court, canSet = !isSenior();
  const sorted=[...board]
    .filter(c=>{ const n=parseInt(c.court); return (n>=1 && n<=17) || ourCourts.has(String(c.court)); })
    .sort((a,b)=>(parseInt(a.court)||999)-(parseInt(b.court)||999));
  h+=`<div class="grid">`;
  for(const c of sorted) h+=boardCell(c, senCourt, canSet);
  h+=`</div>`;
  $("main").innerHTML=h;
}

function renderList(){
  const bc=boardByCourt();
  const mine=myMatters().slice().sort((a,b)=>(parseInt(a.courtNo)||999)-(parseInt(b.courtNo)||999)||(parseFloat(a.itemNo)||999)-(parseFloat(b.itemNo)||999));
  let h=`<div class="legend" style="margin-bottom:12px">Chamber cause list · ${todayISO().split("-").reverse().join(".")}</div>`;
  if(!mine.length){ $("main").innerHTML=h+`<div class="empty">Today's day sheet is empty.</div>`; return; }
  for(const e of mine){
    const k=classify(e,bc[e.courtNo]);
    const jl=(e.juniorUids||[]).map(u=>users[u]?.name||"").filter(Boolean).map(n=>n.split(" ")[0]).join(" / ");
    h+=`<div class="li"><div class="ci"><div class="c">Ct ${esc(e.courtNo)}</div><div class="i">${esc(e.itemNo)}</div>
        <span class="badge2 ${k.tier}">${esc(k.short||"")}</span></div>
      <div class="d"><div class="t">${esc(e.caseTitle||"—")}</div>
      <div class="m">${e.bench?`<b>Bench:</b> ${esc(e.bench)}<br>`:""}${e.counsel?`${esc(e.counsel)}`:""}${jl?` — ${esc(jl)}`:""}${e.confTime?`<br><b>Conf:</b> ${esc(e.confTime)}`:""}</div>
      </div></div>`;
  }
  $("main").innerHTML=h;
}

function renderChat(){
  const list=Object.values(messages).sort((a,b)=>tsMs(a.at)-tsMs(b.at));
  let bubbles = list.length ? list.map(m=>{
    const mine=m.by===me?.uid;
    return `<div class="msg ${mine?"mine":""}">${mine?"":`<div class="who">${esc(m.name||"—")}</div>`}
      <div class="tx">${esc(m.text)}</div><div class="tm">${m.at?agoTxt(tsMs(m.at)):""}</div></div>`;
  }).join("") : `<div class="empty">No messages yet. Coordinate here — everyone in the chamber sees it live.</div>`;
  $("main").innerHTML=`<div id="chatWrap"><div id="chatList">${bubbles}</div>
    <div class="chatbar"><input id="chatIn" placeholder="Message the chamber…" autocomplete="off">
    <button id="chatSend"><i class="ti ti-send"></i></button></div></div>`;
  const cl=$("chatList"); cl.scrollTop=cl.scrollHeight;
  $("chatSend").onclick=sendChat;
  $("chatIn").onkeydown=ev=>{ if(ev.key==="Enter") sendChat(); };
  $("chatIn").focus();
  lastSeenChat=Date.now(); updateChatBadge();
}
async function sendChat(){
  const inp=$("chatIn"); const t=(inp.value||"").trim(); if(!t) return; inp.value="";
  await db.add("messages",{by:me.uid,name:me.name||"",text:t.slice(0,1000),at:db.now()});
}
function updateChatBadge(){
  const unseen=Object.values(messages).filter(m=>tsMs(m.at)>lastSeenChat && m.by!==me?.uid).length;
  const b=$("chatBadge");
  if(unseen>0 && curTab!=="chat"){ b.textContent=unseen; b.classList.remove("hidden"); } else b.classList.add("hidden");
}

function render(){
  if(curTab==="board") renderBoard();
  else if(curTab==="list") renderList();
  else if(curTab==="chat") renderChat();
  $("paneTop").classList.toggle("hidden", curTab!=="board");
}

/* ============================================================
   ACTIONS + AUTH + BOOT
   ============================================================ */
async function setSeniorCourt(court){
  if(!court) return;
  await db.set("config/live",{ court:{court:String(court),at:db.now(),by:me.uid} }, true);
}
function boot(user){
  unsub.forEach(u=>u&&u()); unsub=[]; if(userDocUnsub){userDocUnsub();userDocUnsub=null;}
  if(!user){ me=null; $("app").classList.add("hidden"); $("login").classList.remove("hidden"); stopPolling(); return; }
  const uid=user.uid;
  userDocUnsub=db.watchDoc("users/"+uid, u=>{
    me = u ? {uid,...u} : {uid,role:"pending",name:user.email};
    if(emailKey(me.email||user.email)===emailKey(CHAMBER.adminEmail)) me.role="admin";
    if(!bootStarted){ bootStarted=true; startWatchers(); }
    gateUI();
  });
}
let bootStarted=false;
function startWatchers(){
  unsub.push(db.watchCollection("users",rows=>{ users={}; rows.forEach(u=>users[u.id]=u); render(); }));
  unsub.push(db.watchDoc("config/live", d=>{ live=d||{}; delete live.id; render(); }));
  unsub.push(db.watchCollection("messages",rows=>{ messages={}; rows.forEach(m=>messages[m.id]=m); updateChatBadge(); if(curTab==="chat") renderChat(); }));
  unsub.push(db.watchDoc("daysheets/"+todayISO(), d=>{ daysheet=d||{entries:[]}; render(); }));
  startPolling();
}
function gateUI(){
  const approved = me && ["admin","senior","clerk","pa","junior"].includes(me.role);
  $("login").classList.toggle("hidden", !!approved);
  $("app").classList.toggle("hidden", !approved);
  if(approved){ render(); }
  else if(me){ $("lgErr").textContent = me.role==="pending" ? "Your account isn't approved yet. Ask Adith to add you." : ""; }
}

/* tabs (bottom nav) + header wiring */
document.querySelectorAll("nav.botnav button").forEach(b=>b.onclick=()=>{
  curTab=b.dataset.tab;
  document.querySelectorAll("nav.botnav button").forEach(x=>x.classList.toggle("on",x===b));
  render();
});
$("main").addEventListener("click",ev=>{
  const sc=ev.target.closest("[data-setcourt]");
  if(sc && !isSenior()){ setSeniorCourt(sc.dataset.setcourt); }
});
$("btnRefresh").onclick=hardRefresh;
$("btnOut").onclick=()=>auth.signOut();

/* login form */
$("lgGo").onclick=async()=>{
  $("lgErr").textContent="";
  try{ await auth.signIn($("lgEmail").value.trim(), $("lgPass").value); }
  catch(e){ $("lgErr").textContent = (e.code||"").includes("password")||(e.code||"").includes("credential")
    ? "Wrong email or password." : (e.message||"Sign-in failed."); }
};
$("lgPass").addEventListener("keydown",e=>{ if(e.key==="Enter") $("lgGo").click(); });
$("lgReset").onclick=async()=>{
  const em=$("lgEmail").value.trim(); if(!em){ $("lgErr").textContent="Enter your email first."; return; }
  try{ await auth.resetPassword(em); $("lgErr").textContent="Reset link sent to "+em; }
  catch(e){ $("lgErr").textContent=e.message||"Could not send reset."; }
};
document.addEventListener("visibilitychange",()=>{ if(!document.hidden && me && !DEMO) fetchBoard(); });

auth.onChange(boot);
$("lgName").textContent = CHAMBER.seniorName ? CHAMBER.seniorName.split(" ")[0]+"'s Chamber — Display Board" : "Chamber Display Board";
$("hdrName").textContent = "Chambers of "+CHAMBER.seniorName;
$("hdrSub").textContent  = CHAMBER.designation+" · "+CHAMBER.court;

/* ============================================================
   DEMO SEED (only used when DEMO=true; injected by make-board-test.py)
   ============================================================ */
function seedDemo(db){}
